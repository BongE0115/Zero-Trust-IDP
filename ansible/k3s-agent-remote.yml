---
- name: Configure k3s agent remotely through SSM
  hosts: k3s_agent
  become: true
  gather_facts: true

  vars:
    k3s_version: "v1.33.9+k3s1"

  tasks:
    - name: Create swap file if not exists
      shell: |
        if ! swapon --show | grep -q "/swapfile"; then
          fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
        fi
        grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
      args:
        executable: /bin/bash

    - name: Install base packages
      apt:
        update_cache: true
        name:
          - curl
          - nfs-common
          - ca-certificates
          - apt-transport-https
          - jq
          - awscli
        state: present

    # ---------------------------------------------------------
    # [추가 1] Node Exporter 설치 및 실행
    # ---------------------------------------------------------
    - name: Download and extract Node Exporter
      unarchive:
        src: "https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true
        creates: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter

    - name: Install Node Exporter binary
      copy:
        src: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        mode: "0755"
        remote_src: true

    - name: Configure and start Node Exporter service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        mode: "0644"
        content: |
          [Unit]
          Description=Node Exporter
          After=network-online.target

          [Service]
          User=root
          Type=simple
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target

    - name: Enable and restart Node Exporter
      systemd:
        name: node_exporter
        enabled: true
        state: restarted
        daemon_reload: true


    - name: Resolve master host from inventory
      set_fact:
        master_host: "{{ groups['k3s_server'][0] }}"

    - name: Resolve master instance id
      set_fact:
        master_instance_id: "{{ hostvars[master_host]['ansible_host'] }}"

    - name: Get master private IP from EC2 API
      delegate_to: localhost
      become: false
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        instance_ids:
          - "{{ master_instance_id }}"
      register: master_ec2_info

    - name: Set master private IP fact
      set_fact:
        master_private_ip: "{{ master_ec2_info.instances[0].private_ip_address }}"

    - name: Wait for master API
      shell: |
        for i in $(seq 1 40); do
          curl -k https://{{ master_private_ip }}:6443 >/dev/null 2>&1 && exit 0
          echo "[INFO] Waiting for K3s API on master... ($i/40)"
          sleep 15
        done
        exit 1
      args:
        executable: /bin/bash

    - name: Read k3s node token from master
      shell: sudo cat /var/lib/rancher/k3s/server/node-token
      delegate_to: "{{ master_host }}"
      register: k3s_node_token
      changed_when: false

    - name: Install k3s agent
      shell: |
        if [ ! -f /etc/systemd/system/k3s-agent.service ]; then
          curl -sfL https://get.k3s.io | \
            INSTALL_K3S_VERSION="{{ k3s_version }}" \
            K3S_URL="https://{{ master_private_ip }}:6443" \
            K3S_TOKEN="{{ k3s_node_token.stdout | trim }}" \
            sh -s - agent
        fi
      args:
        executable: /bin/bash

    - name: Enable k3s-agent
      systemd:
        name: k3s-agent
        enabled: true

    - name: Restart k3s-agent
      systemd:
        name: k3s-agent
        state: restarted
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dlq-handler-cluster-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dlq-handler-global-binding
subjects:
- kind: ServiceAccount
  name: dlq-handler-sa
  namespace: kafka-poc
roleRef:
  kind: ClusterRole
  name: dlq-handler-cluster-role
  apiGroup: rbac.authorization.k8s.io

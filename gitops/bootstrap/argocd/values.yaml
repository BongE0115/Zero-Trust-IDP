global:
  # 1. 마스터 노드에만 배포되도록 라벨 지정
  nodeSelector:
    node-role.kubernetes.io/master: "true"
  
  # 2. 마스터 노드의 '접근 제한(Taint)'을 허용하는 설정
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

configs:
  params:
    server.insecure: "true"

server:
  ingress:
    enabled: false
  service:
    type: NodePort
    nodePortHttp: 30080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

applicationController:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 150m
      memory: 256Mi

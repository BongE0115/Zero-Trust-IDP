apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/BongE0115/Zero-Trust-IDP.git'
    path: gitops/apps/boutique-local
    targetRevision: jy 
  destination:
    name: boutique-local-cluster 
    namespace: boutique-local    # 로컬용 네임스페이스
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
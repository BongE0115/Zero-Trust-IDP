apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/BongE0115/Zero-Trust-IDP.git'
    path: gitops/apps/boutique-local
    targetRevision: jy # 🔥 회원님의 현재 브랜치
  destination:
    name: boutique-local # 🔥 아까 동료가 추가한 로컬 클러스터 이름!
    namespace: boutique-local    # 로컬용 네임스페이스
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
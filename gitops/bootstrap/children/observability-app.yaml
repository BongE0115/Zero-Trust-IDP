apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-app
  namespace: argocd
  annotations:
    # 모니터링 시스템은 인프라 초기 단계(Wave 0)에서 배포됩니다.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'https://github.com/BongE0115/Zero-Trust-IDP.git'
    # [핵심] 현재 작업 중인 hs 브랜치를 추적합니다.
    targetRevision: hs
    # [수정] 팀 표준 경로에 맞춰 error_category_map/ 를 제거했습니다.
    path: gitops/platform/observability/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
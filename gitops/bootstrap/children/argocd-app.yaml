apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-app
  namespace: argocd
  annotations:
    # 다른 앱들보다 가장 먼저(Wave -10) 자기 자신을 최신화합니다.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default

  sources:
    # 1. 헬름 차트 소스 (ArgoCD 설치 본체)
    - repoURL: 'https://argoproj.github.io/argo-helm'
      chart: argo-cd
      targetRevision: 8.0.0
      helm:
        releaseName: argocd
        valueFiles:
          # [수정] 팀 표준 경로인 /gitops/... 를 따릅니다.
          - $values/gitops/bootstrap/argocd/values.yaml

    # 2. 설정값 소스 (우리 레포지토리)
    - repoURL: 'https://github.com/BongE0115/Zero-Trust-IDP.git'
      # [핵심] 현재 작업 중인 hs 브랜치를 추적하도록 설정합니다.
      targetRevision: hs
      ref: values

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
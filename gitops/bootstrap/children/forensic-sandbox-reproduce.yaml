apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forensic-sandbox-reproduce
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: forensic-sandbox
  source:
    repoURL: https://github.com/BongE0115/Zero-Trust-IDP.git
    targetRevision: jy
    path: gitops/apps/forensic-sandbox/cases/reproduce
    directory:
      recurse: true
      include: "*.yaml"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forensic-sandbox-app
  namespace: argocd
  annotations:
    # Kafka 인프라(Wave -10)나 다른 앱들이 뜬 뒤에 순차적으로 뜨도록 설정되어 있습니다.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: 'https://github.com/BongE0115/Zero-Trust-IDP.git'
    # [핵심] 현재 작업 중인 hs 브랜치를 추적합니다.
    targetRevision: hs
    # [수정] 팀 표준 경로인 gitops/... 를 사용합니다.
    path: gitops/apps/forensic-sandbox
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: forensic-sandbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
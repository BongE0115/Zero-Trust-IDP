apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/BongE0115/Zero-Trust-IDP.git'
    # [핵심] 현재 작업 중인 hs 브랜치를 추적합니다.
    targetRevision: hs
    # [수정] 팀 표준 경로에 맞춰 error_category_map/ 를 제거했습니다.
    path: gitops/platform/istio/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/BongE0115/Zero-Trust-IDP.git'
    path: gitops/apps/boutique-production
    targetRevision: jy # 🔥 회원님의 현재 브랜치
  destination:
    server: 'https://kubernetes.default.svc' # AWS 자기 자신 클러스터
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
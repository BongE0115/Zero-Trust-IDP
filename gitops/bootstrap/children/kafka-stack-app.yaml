apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-poc-app # 파일 이름은 stack이지만 실제 배포 대상은 poc입니다.
  namespace: argocd
  annotations:
    # 인프라가 모두 구성된 뒤 가장 마지막(Wave 20)에 안전하게 배포됩니다.
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: 'https://github.com/BongE0115/Zero-Trust-IDP.git'
    # [핵심] 현재 작업 중인 hs 브랜치를 추적합니다.
    targetRevision: hs
    # [수정] 팀 표준 경로에 맞춰 error_category_map/ 를 제거했습니다.
    path: gitops/apps/kafka-poc/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kafka-poc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-poc-app 
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20" 
spec:
  project: default
  source:
    # 사용자님의 GitHub 저장소 주소
    repoURL: 'https://github.com/BongE0115/Zero-Trust-IDP.git'
    # 현재 작업 중인 브랜치 (jy)
    targetRevision: jy 
    # Kustomization.yaml 파일이 위치한 경로
    path: gitops/apps/kafka-poc/manifests # poc -> stack
  destination:
    server: 'https://kubernetes.default.svc'
    # Kafka와 Zookeeper가 배포될 네임스페이스
    namespace: kafka-poc 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forensic-sandbox-cases
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/BongE0115/Zero-Trust-IDP.git'
    targetRevision: jy
    path: gitops/apps/forensic-sandbox/cases
    directory:
      recurse: true
      include: "sandbox-case-*.yaml"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: forensic-sandbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forensic-sandbox-cases-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: 'https://github.com/BongE0115/Zero-Trust-IDP.git'
    targetRevision: jy
    path: gitops/apps/forensic-sandbox/cases
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: forensic-sandbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
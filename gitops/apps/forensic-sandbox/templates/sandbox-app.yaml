apiVersion: v1
kind: Namespace
metadata:
  name: forensic-sandbox
  labels:
    istio.io/dataplane-mode: ambient
apiVersion: v1
kind: Service
metadata:
  name: mongodb-temp
  namespace: forensic-sandbox
spec:
  selector:
    app: mongodb-temp
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-temp
  namespace: forensic-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-temp
  template:
    metadata:
      labels:
        app: mongodb-temp
    spec:
      containers:
        - name: mongodb-temp
          image: mongo:7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forensic-sandbox-app
  namespace: forensic-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forensic-sandbox-app
  template:
    metadata:
      labels:
        app: forensic-sandbox-app
        sandbox-tier: strict-isolation
        istio.io/use-waypoint: sandbox-waypoint
    spec:
      serviceAccountName: sandbox-app-sa
      automountServiceAccountToken: false
  
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
    spec:
      initContainers:
        - name: topic-init
          image: bitnamilegacy/kafka:3.7
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "topic-init placeholder"
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka.kafka-poc.svc.cluster.local:9092
            - name: REPLAY_TOPIC
              value: ""
            - name: RESULT_TOPIC
              value: ""
            - name: TOPIC_PARTITIONS
              value: "1"
            - name: TOPIC_REPLICATION_FACTOR
              value: "1"
        - name: artifact-init
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /artifacts
              echo '{}' > /artifacts/failure.json
              echo '{}' > /artifacts/normal.json
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
      containers:
        - name: consumer-app
          image: ghcr.io/bonge0115/worker-consumer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka.kafka-poc.svc.cluster.local:9092
            - name: SOURCE_TOPIC
              value: ""
            - name: DLQ_TOPIC
              value: orders-dlq
            - name: GROUP_ID
              value: orders-consumer-sandbox
            - name: SERVICE_NAME
              value: forensic-sandbox-app
            - name: NAMESPACE
              value: forensic-sandbox
            - name: DEPLOYMENT_NAME
              value: forensic-sandbox-app
            - name: IMAGE_REF
              value: ghcr.io/bonge0115/worker-consumer:latest
            - name: CONFIG_VERSION
              value: v1
            - name: DEPENDENCY_PROFILE
              value: sandbox
            - name: DB_MODE
              value: mock
            - name: DB_HOST
              value: mongodb-temp.forensic-sandbox.svc.cluster.local
            - name: CACHE_MODE
              value: mock
            - name: CACHE_HOST
              value: ""
            - name: EXTERNAL_API_MODE
              value: mock
            - name: EXTERNAL_API_BASE_URL
              value: ""
            - name: FORCE_FAIL_FIELD
              value: should_fail
            - name: ENABLE_DLQ_PUBLISH
              value: "false"
            - name: RUN_MODE
              value: sandbox
            - name: CASE_ID
              value: ""
            - name: RESULT_TOPIC
              value: ""
            - name: EMIT_RESULT_EVENT
              value: "true"
            - name: READY_FILE_PATH
              value: /artifacts/consumer-ready.json
            - name: ISOLATION_MODE
              value: sandbox_strict
            - name: ALLOWED_REPLAY_TOPIC
              value: ""
            - name: ALLOWED_RESULT_TOPIC
              value: ""
            - name: VALIDATION_MODE
              value: reproduce
            - name: VALIDATION_RUN_ID
              value: ""
            - name: REVALIDATION_GENERATION
              value: "0"
            - name: EXPECTED_FAILURE_STATUS
              value: failed
            - name: EXPECTED_NORMAL_STATUS
              value: success
            - name: FAILURE_ERROR_TYPE
              value: ""
            - name: FAILURE_ERROR_MESSAGE
              value: ""
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
      volumes:
        - name: artifacts
          emptyDir: {}

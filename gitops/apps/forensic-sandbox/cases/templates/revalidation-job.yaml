apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: forensic-revalidation
    app.kubernetes.io/component: launcher
    forensic-case-id: __CASE_ID__
    forensic-validation-mode: __VALIDATION_MODE__
    forensic-revalidation-generation: "__REVALIDATION_GENERATION__"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forensic-revalidation
        app.kubernetes.io/component: launcher
        forensic-case-id: __CASE_ID__
        forensic-validation-mode: __VALIDATION_MODE__
        forensic-revalidation-generation: "__REVALIDATION_GENERATION__"
    spec:
      restartPolicy: Never
      initContainers:
        - name: artifact-init
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /artifacts
              cat > /artifacts/failure.json <<'EOF'
__FAILURE_ARTIFACT_JSON__
EOF
              cat > /artifacts/normal.json <<'EOF'
__NORMAL_ARTIFACT_JSON__
EOF
              cat > /artifacts/consumer-ready.json <<'EOF'
__READY_FILE_JSON__
EOF
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts

      containers:
        - name: forensic-launcher
          image: __LAUNCHER_IMAGE_REF__
          imagePullPolicy: IfNotPresent
          env:
            - name: CASE_ID
              value: "__CASE_ID__"
            - name: VALIDATION_MODE
              value: "__VALIDATION_MODE__"
            - name: VALIDATION_RUN_ID
              value: "__VALIDATION_RUN_ID__"
            - name: REVALIDATION_GENERATION
              value: "__REVALIDATION_GENERATION__"

            - name: KAFKA_BOOTSTRAP
              value: "__KAFKA_BOOTSTRAP__"
            - name: REPLAY_TOPIC
              value: "__REPLAY_TOPIC__"
            - name: RESULT_TOPIC
              value: "__RESULT_TOPIC__"
            - name: RESULT_GROUP_ID
              value: "forensic-launcher-revalidation"

            - name: FAILURE_ARTIFACT_PATH
              value: "__FAILURE_ARTIFACT_PATH__"
            - name: NORMAL_ARTIFACT_PATH
              value: "__NORMAL_ARTIFACT_PATH__"
            - name: VERDICT_FILE_PATH
              value: "/artifacts/verdict.json"

            - name: ENABLE_NORMAL_VALIDATION
              value: "__ENABLE_NORMAL_VALIDATION__"

            - name: READY_FILE_PATH
              value: "/artifacts/consumer-ready.json"
            - name: READY_WAIT_SECONDS
              value: "5"
            - name: BETWEEN_FAILURE_AND_NORMAL_SECONDS
              value: "5"
            - name: RESULT_WAIT_SECONDS
              value: "60"

            - name: EXPECTED_FAILURE_STATUS
              value: "__EXPECTED_FAILURE_STATUS__"
            - name: EXPECTED_NORMAL_STATUS
              value: "__EXPECTED_NORMAL_STATUS__"

            - name: ISOLATION_MODE
              value: "sandbox_strict"
            - name: ALLOWED_REPLAY_TOPIC
              value: "__REPLAY_TOPIC__"
            - name: ALLOWED_RESULT_TOPIC
              value: "__RESULT_TOPIC__"

            - name: IMAGE_REF
              value: "__LAUNCHER_IMAGE_REF__"

            - name: POST_VERDICT_SLEEP_SECONDS
              value: "300"

          volumeMounts:
            - name: artifacts
              mountPath: /artifacts

      volumes:
        - name: artifacts
          emptyDir: {}
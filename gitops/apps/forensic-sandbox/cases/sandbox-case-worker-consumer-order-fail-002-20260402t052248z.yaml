          {\n  \"artifact_type\": \"normal_validation\",\n  \"case_id\": \"worker-consumer-order-fail-002-20260402T052248Z-15159316\"\
          ,\n  \"target_topic\": \"orders-replay-worker-consumer-order-fail-002-20260402t052248z-15159316\"\

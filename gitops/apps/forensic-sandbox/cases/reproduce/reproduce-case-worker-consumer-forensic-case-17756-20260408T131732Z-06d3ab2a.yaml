apiVersion: batch/v1
kind: Job
metadata:
  name: forensic-reproduce-worker-consumer-forensic-cas-44c601d8
  namespace: forensic-sandbox
  labels:
    app: forensic-reproduce-worker-consumer-forensic-cas-44c601d8
    forensic-case-id: worker-consumer-forensic-case-17756-20260408T131732Z-06d3ab2a
    forensic-validation-mode: reproduce
    forensic-revalidation-generation: "0"
    forensic-job-hash: "44c601d8"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: forensic-reproduce-worker-consumer-forensic-cas-44c601d8
        forensic-case-id: worker-consumer-forensic-case-17756-20260408T131732Z-06d3ab2a
        forensic-validation-mode: reproduce
        forensic-revalidation-generation: "0"
        forensic-job-hash: "44c601d8"
        sandbox-tier: strict-isolation
        istio.io/use-waypoint: sandbox-waypoint
    spec:
      restartPolicy: Never
      initContainers:
        - name: artifact-init
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /artifacts
              printf '%s' '{"artifact_type": "failure_replay", "case_id": "worker-consumer-forensic-case-17756-20260408T131732Z-06d3ab2a", "target_topic": "orders-replay-worker-consumer-forensic-case-17756-20260408t131732z-06d3ab2a", "payload_hash": "06d3ab2a5566ebf6edf8c50d6b7c1048cc0187c84186a3ea66a093ba879dbf98", "created_at": "2026-04-08T13:17:32.915806+00:00", "source_service": "worker-consumer", "payload": {"order_id": "forensic-case-1775654252", "should_fail": true, "payload": {"item": "AIOps-OneShot-Test", "qty": 1}}}' > /artifacts/failure.json
              printf '%s' '{"artifact_type": "normal_validation", "case_id": "worker-consumer-forensic-case-17756-20260408T131732Z-06d3ab2a", "target_topic": "orders-replay-worker-consumer-forensic-case-17756-20260408t131732z-06d3ab2a", "payload_hash": "", "created_at": "2026-04-08T13:17:32.918965+00:00", "enabled": false, "source_service": "worker-consumer", "payload": {}}' > /artifacts/normal.json
              printf '%s' '{"ready": true, "case_id": "worker-consumer-forensic-case-17756-20260408T131732Z-06d3ab2a", "source_topic": "orders-replay-worker-consumer-forensic-case-17756-20260408t131732z-06d3ab2a", "source": "workflow_wait"}' > /artifacts/consumer-ready.json
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
      containers:
        - name: forensic-launcher
          image: ghcr.io/bonge0115/forensic-launcher:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka.kafka-poc.svc.cluster.local:9092
            - name: CASE_ID
              value: worker-consumer-forensic-case-17756-20260408T131732Z-06d3ab2a
            - name: REPLAY_TOPIC
              value: orders-replay-worker-consumer-forensic-case-17756-20260408t131732z-06d3ab2a
            - name: RESULT_TOPIC
              value: orders-result-worker-consumer-forensic-case-17756-20260408t131732z-06d3ab2a
            - name: RESULT_GROUP_ID
              value: forensic-launcher-reproduce
            - name: FAILURE_ARTIFACT_PATH
              value: /artifacts/failure.json
            - name: NORMAL_ARTIFACT_PATH
              value: /artifacts/normal.json
            - name: VERDICT_FILE_PATH
              value: /artifacts/verdict.json
            - name: ENABLE_NORMAL_VALIDATION
              value: "true"
            - name: READY_FILE_PATH
              value: /artifacts/consumer-ready.json
            - name: READY_WAIT_SECONDS
              value: "5"
            - name: BETWEEN_FAILURE_AND_NORMAL_SECONDS
              value: "5"
            - name: RESULT_WAIT_SECONDS
              value: "60"
            - name: EXPECTED_FAILURE_ERROR_TYPE
              value: ""
            - name: ISOLATION_MODE
              value: sandbox_strict
            - name: ALLOWED_REPLAY_TOPIC
              value: orders-replay-worker-consumer-forensic-case-17756-20260408t131732z-06d3ab2a
            - name: ALLOWED_RESULT_TOPIC
              value: orders-result-worker-consumer-forensic-case-17756-20260408t131732z-06d3ab2a
            - name: VALIDATION_MODE
              value: reproduce
            - name: VALIDATION_RUN_ID
              value: reproduce-worker-consumer-forensic-case-17756-20260408T131732Z-06d3ab2a-0
            - name: REVALIDATION_GENERATION
              value: "0"
            - name: EXPECTED_FAILURE_STATUS
              value: failed
            - name: EXPECTED_NORMAL_STATUS
              value: success
            - name: POST_VERDICT_SLEEP_SECONDS
              value: "300"
            - name: IMAGE_REF
              value: ghcr.io/bonge0115/forensic-launcher:latest
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
      volumes:
        - name: artifacts
          emptyDir: {}

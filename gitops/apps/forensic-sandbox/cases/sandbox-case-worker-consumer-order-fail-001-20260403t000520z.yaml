apiVersion: apps/v1
kind: Deployment
metadata:
  name: forensic-sandbox-app-worker-consumer-order-fa
  namespace: forensic-sandbox
  labels:
    forensic-case-id: worker-consumer-order-fail-001-20260403T000520Z-a3af3ea8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forensic-sandbox-app-worker-consumer-order-fa
  template:
    metadata:
      labels:
        app: forensic-sandbox-app-worker-consumer-order-fa
        forensic-case-id: worker-consumer-order-fail-001-20260403T000520Z-a3af3ea8
    spec:
      initContainers:
      - name: topic-init
        image: bitnamilegacy/kafka:3.7
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - "set -eu\n\nBOOTSTRAP=\"${KAFKA_BOOTSTRAP}\"\nPARTITIONS=\"${TOPIC_PARTITIONS:-1}\"\
          \nREPLICATION_FACTOR=\"${TOPIC_REPLICATION_FACTOR:-1}\"\n\ncreate_topic()\
          \ {\n  topic=\"$1\"\n  if [ -z \"$topic\" ]; then\n    return 0\n  fi\n\n\
          \  /opt/bitnami/kafka/bin/kafka-topics.sh \\\n    --bootstrap-server \"\
          $BOOTSTRAP\" \\\n    --create \\\n    --if-not-exists \\\n    --topic \"\
          $topic\" \\\n    --partitions \"$PARTITIONS\" \\\n    --replication-factor\
          \ \"$REPLICATION_FACTOR\"\n}\n\ncreate_topic \"${REPLAY_TOPIC}\"\ncreate_topic\
          \ \"${RESULT_TOPIC}\"\n\necho \"[OK] topic-init completed\"\n"
        env:
        - name: KAFKA_BOOTSTRAP
          value: kafka.kafka-poc.svc.cluster.local:9092
        - name: REPLAY_TOPIC
          value: orders-replay-worker-consumer-order-fail-001-20260403t000520z-a3af3ea8
        - name: RESULT_TOPIC
          value: orders-result-worker-consumer-order-fail-001-20260403t000520z-a3af3ea8
        - name: TOPIC_PARTITIONS
          value: '1'
        - name: TOPIC_REPLICATION_FACTOR
          value: '1'
      - name: artifact-init
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - "mkdir -p /artifacts\ncat > /artifacts/failure.json <<'EOF'\n{\n  \"artifact_type\"\
          : \"failure_replay\",\n  \"case_id\": \"worker-consumer-order-fail-001-20260403T000520Z-a3af3ea8\"\
          ,\n  \"target_topic\": \"orders-replay-worker-consumer-order-fail-001-20260403t000520z-a3af3ea8\"\
          ,\n  \"payload_hash\": \"a3af3ea86427059a3503796f662f71227e07021855468cb7f488158ce9789f45\"\
          ,\n  \"created_at\": \"2026-04-03T00:05:20.297610+00:00\",\n  \"source_service\"\
          : \"worker-consumer\",\n  \"payload\": {\n    \"order_id\": \"order-fail-001\"\
          ,\n    \"should_fail\": true,\n    \"payload\": {\n      \"item\": \"book\"\
          ,\n      \"qty\": 1\n    }\n  }\n}\nEOF\ncat > /artifacts/normal.json <<'EOF'\n\
          {\n  \"artifact_type\": \"normal_validation\",\n  \"case_id\": \"worker-consumer-order-fail-001-20260403T000520Z-a3af3ea8\"\
          ,\n  \"target_topic\": \"orders-replay-worker-consumer-order-fail-001-20260403t000520z-a3af3ea8\"\
          ,\n  \"payload_hash\": \"\",\n  \"created_at\": \"2026-04-03T00:05:20.300489+00:00\"\
          ,\n  \"enabled\": false,\n  \"source_service\": \"worker-consumer\",\n \
          \ \"payload\": {}\n}\nEOF\n"
        volumeMounts:
        - name: artifacts
          mountPath: /artifacts
      containers:
      - name: consumer-app
        image: ghcr.io/bonge0115/worker-consumer:6976091
        imagePullPolicy: IfNotPresent
        env:
        - name: KAFKA_BOOTSTRAP
          value: kafka.kafka-poc.svc.cluster.local:9092
        - name: SOURCE_TOPIC
          value: orders-replay-worker-consumer-order-fail-001-20260403t000520z-a3af3ea8
        - name: DLQ_TOPIC
          value: orders-dlq
        - name: GROUP_ID
          value: orders-consumer-sandbox-worker-consumer-order-fail-001-20260403t000520z-a3af3ea8
        - name: SERVICE_NAME
          value: forensic-sandbox-app-worker-consumer-order-fa
        - name: NAMESPACE
          value: forensic-sandbox
        - name: DEPLOYMENT_NAME
          value: forensic-sandbox-app-worker-consumer-order-fa
        - name: IMAGE_REF
          value: ghcr.io/bonge0115/worker-consumer:6976091
        - name: CONFIG_VERSION
          value: v1
        - name: DEPENDENCY_PROFILE
          value: sandbox
        - name: DB_MODE
          value: mock
        - name: DB_HOST
          value: mongodb-temp-worker-consumer-order-fa.forensic-sandbox.svc.cluster.local
        - name: CACHE_MODE
          value: mock
        - name: CACHE_HOST
          value: ''
        - name: EXTERNAL_API_MODE
          value: mock
        - name: EXTERNAL_API_BASE_URL
          value: ''
        - name: FORCE_FAIL_FIELD
          value: should_fail
        - name: ENABLE_DLQ_PUBLISH
          value: 'false'
        - name: RUN_MODE
          value: sandbox
        - name: CASE_ID
          value: worker-consumer-order-fail-001-20260403T000520Z-a3af3ea8
        - name: RESULT_TOPIC
          value: orders-result-worker-consumer-order-fail-001-20260403t000520z-a3af3ea8
        - name: EMIT_RESULT_EVENT
          value: 'true'
        - name: READY_FILE_PATH
          value: /artifacts/consumer-ready.json
        - name: ISOLATION_MODE
          value: sandbox_strict
        - name: ALLOWED_REPLAY_TOPIC
          value: orders-replay-worker-consumer-order-fail-001-20260403t000520z-a3af3ea8
        - name: ALLOWED_RESULT_TOPIC
          value: orders-result-worker-consumer-order-fail-001-20260403t000520z-a3af3ea8
        - name: VALIDATION_MODE
          value: reproduce
        - name: VALIDATION_RUN_ID
          value: worker-consumer-order-fail-001-20260403T000520Z-a3af3ea8-repro-0
        - name: REVALIDATION_GENERATION
          value: '0'
        - name: EXPECTED_FAILURE_STATUS
          value: failed
        - name: EXPECTED_NORMAL_STATUS
          value: success
        - name: FAILURE_ERROR_TYPE
          value: ValueError
        - name: FAILURE_ERROR_MESSAGE
          value: intentional failure for POC
        - name: REPLAY_PAYLOAD_HASH
          value: a3af3ea86427059a3503796f662f71227e07021855468cb7f488158ce9789f45
        - name: REPLAY_ORDER_ID
          value: order-fail-001
        - name: NORMAL_PAYLOAD_HASH
          value: ''
        volumeMounts:
        - name: artifacts
          mountPath: /artifacts
      volumes:
      - name: artifacts
        emptyDir: {}

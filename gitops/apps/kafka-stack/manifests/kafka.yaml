apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: bitnami/kafka:3.7
        ports:
        - containerPort: 9092 
        env:
        # 1. Zookeeper 연결 설정
        - name: KAFKA_CFG_ZOOKEEPER_CONNECT
          value: zookeeper:2181 
          
        # 2. 보안 및 리스너 설정
        - name: ALLOW_PLAINTEXT_LISTENER
          value: "yes" 
        - name: KAFKA_CFG_LISTENERS
          value: PLAINTEXT://:9092 
        - name: KAFKA_CFG_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka:9092 
          
        # 3. 토픽 관리 설정 (백엔드 코드와 정합성 유지)
        - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
          value: "true" 
        - name: KAFKA_CREATE_TOPICS
          value: "aiops-topic:3:1" 
          
        # 4. 성능 및 리소스 최적화 (보완 사항)
        - name: KAFKA_HEAP_OPTS
          value: "-Xms512m -Xmx512m" 
          
        # 5. 로그 보관 정책 (디스크 관리용)
        - name: KAFKA_CFG_LOG_RETENTION_HOURS
          value: "168" 

        # 컨테이너 자원 할당량 제한 (클러스터 안정성 확보)
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka 
  namespace: kafka
spec:
  selector:
    app: kafka
  ports:
    - port: 9092 
      targetPort: 9092 

# frontend.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-external
spec:
  type: NodePort 
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        # Prometheus 관제 이름표 추가
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      serviceAccountName: frontend
      containers:
        - name: server
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/frontend:v0.10.5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          env:
          - name: LOCAL_IP
            valueFrom:
              configMapKeyRef:
                name: aws-global-env
                key: LOCAL_TAILSCALE_IP
          - name: PORT
            value: "8080"
          # $(변수명) 치환
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            value: "$(LOCAL_IP):30550" 
          - name: CURRENCY_SERVICE_ADDR
            value: "$(LOCAL_IP):30001"
          - name: CART_SERVICE_ADDR
            value: "$(LOCAL_IP):30002"
          - name: RECOMMENDATION_SERVICE_ADDR
            value: "$(LOCAL_IP):30003"
          - name: AD_SERVICE_ADDR
            value: "$(LOCAL_IP):30005"
          - name: SHIPPING_SERVICE_ADDR
            value: "shippingservice:50051"
          - name: CHECKOUT_SERVICE_ADDR
            value: "checkoutservice:5050"
          - name: SHOPPING_ASSISTANT_SERVICE_ADDR
            value: "shoppingassistantservice:80"

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - frontend.yaml
  - checkoutservice.yaml
  - paymentservice.yaml & shippingservice.yaml
  - hpa.yaml

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          httpGet:
            path: /_healthz # 부티크 앱의 기본 헬스체크 경로
            port: 8080
          initialDelaySeconds: 20 # 앱 실행 후 20초 뒤부터 체크 시작
          periodSeconds: 15       # 15초 간격으로 상태 확인
          failureThreshold: 3     # 3번 연속 실패 시 파드 재시작(Healing)
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet:
            path: /_healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10

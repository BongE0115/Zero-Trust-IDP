apiVersion: v1
kind: ServiceAccount
metadata:
  name: loadgenerator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
  labels:
    app: loadgenerator
spec:
  selector:
    matchLabels:
      app: loadgenerator
  replicas: 1
  template:
    metadata:
      labels:
        app: loadgenerator
    spec:
      # nodeSelector:
      #  node-role.kubernetes.io/worker: "true"

      serviceAccountName: loadgenerator
      terminationGracePeriodSeconds: 5
      restartPolicy: Always
      
      # 1. 프론트엔드가 떴는지 먼저 확인
      initContainers:
      - name: frontend-check
        image: busybox:latest
        command:
        - /bin/sh
        - -exc
        - |
          MAX_RETRIES=12
          RETRY_INTERVAL=10

          # 💡 [핵심 수정] 같은 클러스터이므로 내부망 이름(frontend:80)으로 직통 연결!
          TARGET_URL="http://${FRONTEND_ADDR}"

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Pinging frontend: ${TARGET_URL}..."
            
            STATUSCODE=$(wget --server-response ${TARGET_URL} 2>&1 | awk '/^  HTTP/{print $2}')
            
            if [ "$STATUSCODE" = "200" ]; then
                echo "Frontend is reachable."
                exit 0
            fi
            echo "Error: Could not reach frontend - Status code: ${STATUSCODE}"
            sleep $RETRY_INTERVAL
          done
          echo "Failed to reach frontend after $MAX_RETRIES attempts."
          exit 1
        env:
        - name: FRONTEND_ADDR
          value: "frontend:80" # <-- 복잡한 변수 다 지우고 하드코딩

      # 2. 실제 트래픽 전달 컨테이너
      containers:
      - name: main
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/loadgenerator:v0.10.5
        env:
        - name: FRONTEND_ADDR
          value: "frontend:80" # <-- 트래픽도 내부망으로 발사!
        - name: USERS
          value: "10"
        - name: RATE
          value: "1"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
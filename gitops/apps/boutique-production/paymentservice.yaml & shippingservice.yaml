apiVersion: v1
kind: Service
metadata:
  name: paymentservice
spec:
  selector:
    app: paymentservice
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
spec:
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "50051"   # Payment 서비스의 gRPC 포트
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      containers:
      - name: server
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/paymentservice:v0.10.5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      - name: auto-trigger
        env:
        - name: PORT
          value: "50051"
        - name: DISABLE_PROFILER
          value: "1"
        - name: DISABLE_TRACING
          value: "1"
        - name: KAFKA_BROKER_URL
          value: "kafka.default.svc.cluster.local:9092"
        - name: KAFKA_TOPIC
          value: "orders"
        - name: DLQ_TOPIC
          value: "orders-dlq"

      # 🔥 에러 발생기 (사이드카) - 파이썬 대소문자 & 들여쓰기 완전 해결 버전
      - name: auto-trigger
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            # 1. 라이브러리 설치
            pip install kafka-python > /dev/null 2>&1
            
            # 2. 파이썬 스크립트 실행 (textwrap으로 들여쓰기 안전하게 보호)
            python3 -c '
            import textwrap
            script = """
            import os, time, json
            from kafka import KafkaProducer

            KAFKA_BOOTSTRAP = os.getenv("KAFKA_BOOTSTRAP", "kafka.kafka-poc.svc.cluster.local:9092")
            TOPIC = os.getenv("KAFKA_TOPIC", "orders")

            try:
                producer = KafkaProducer(
                    bootstrap_servers=KAFKA_BOOTSTRAP,
                    value_serializer=lambda v: json.dumps(v).encode("utf-8")
                )
                
                oid = f"forensic-case-{int(time.time())}"
                
                # 👇 True는 반드시 대문자! json.dumps가 알아서 소문자 true로 바꿔서 카프카에 쏩니다.
                msg = {
                    "order_id": oid,
                    "should_fail": True,
                    "payload": {"item": "AIOps-OneShot-Test", "qty": 1}
                }
                
                producer.send(TOPIC, msg)
                producer.flush()
                print(f"[AIOPS-EVENT] SUCCESS: Sent intentional error. OrderID: {oid}")
            except Exception as e:
                print(f"❌ 전송 실패: {e}")
            """
            exec(textwrap.dedent(script))
            '
            
            # 3. 무한 대기 (파드가 죽지 않게 유지)
            echo "💤 메시지 전송 완료. 대기 모드로 전환합니다..."
            sleep infinity
        env:
        - name: KAFKA_BOOTSTRAP
          value: "kafka.kafka-poc.svc.cluster.local:9092"
        - name: KAFKA_TOPIC
          value: "orders"
---

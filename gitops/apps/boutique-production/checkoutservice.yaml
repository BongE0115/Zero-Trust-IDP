# checkoutservice.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkoutservice
---
apiVersion: v1
kind: Service
metadata:
  name: checkoutservice
spec:
  type: ClusterIP
  selector:
    app: checkoutservice
  ports:
  - name: grpc
    port: 5050
    targetPort: 5050
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
spec:
  selector:
    matchLabels:
      app: checkoutservice
  template:
    metadata:
      labels:
        app: checkoutservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5050"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"

      serviceAccountName: checkoutservice
      containers:
        - name: server
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/checkoutservice:v0.10.5
          ports:
          - containerPort: 5050
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          env:
          - name: LOCAL_IP
            valueFrom:
              configMapKeyRef:
                name: aws-global-env
                key: LOCAL_TAILSCALE_IP
          - name: PORT
            value: "5050"
          - name: KAFKA_BROKER_URL
            value: "kafka.default.svc.cluster.local:9092"
          - name: KAFKA_TOPIC
            value: "orders"
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            value: "$(LOCAL_IP):30550"
          - name: EMAIL_SERVICE_ADDR
            value: "$(LOCAL_IP):35000"
          - name: CURRENCY_SERVICE_ADDR
            value: "$(LOCAL_IP):30001"
          - name: CART_SERVICE_ADDR
            value: "$(LOCAL_IP):30002"
          - name: SHIPPING_SERVICE_ADDR
            value: "shippingservice:50051"
          - name: PAYMENT_SERVICE_ADDR
            value: "paymentservice:50051"

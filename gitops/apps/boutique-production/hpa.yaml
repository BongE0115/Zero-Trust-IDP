apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: boutique-hpa
  namespace: boutique-local
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cartservice
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 90

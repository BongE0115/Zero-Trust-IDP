apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-api
  namespace: kafka-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer-api
  template:
    metadata:
      labels:
        app: producer-api
    spec:
      containers:
        - name: producer-api
          image: 'ghcr.io/bonge0115/producer-api:03aa2cc' # 이미지는 ghcr로 만든다. 
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka.kafka-poc.svc.cluster.local:9092
            - name: KAFKA_TOPIC
              value: orders
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: producer-api
  namespace: kafka-poc
spec:
  type: LoadBalancer 
  selector:
    app: producer-api
  ports:
    - port: 8081
      targetPort: 8081

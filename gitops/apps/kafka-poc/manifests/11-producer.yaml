apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-api
  namespace: kafka-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer-api
  template:
    metadata:
      labels:
        app: producer-api
    spec:
      containers:
        - name: producer-api
          image: 'ghcr.io/bonge0115/producer-api:07149dd' # 팀 이미지로 통일
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka.kafka-poc.svc.cluster.local:9092
            - name: KAFKA_TOPIC
              value: orders
          ports:
            - containerPort: 8081 # 팀 포트 기준 (8081)
---
apiVersion: v1
kind: Service
metadata:
  name: producer-api
  namespace: kafka-poc
spec:
  type: LoadBalancer # 외부에서 프로듀서 api에 접속하기 위해 로드 밸런스 생성
  selector:
    app: producer-api
  ports:
    - port: 8081
      targetPort: 8081
  # 🚨 여기에 있던 에러 유발 찌꺼기 코드(template...)는 깔끔하게 제거했습니다!
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loadgenerator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
  labels:
    app: loadgenerator
spec:
  selector:
    matchLabels:
      app: loadgenerator
  replicas: 1
  template:
    metadata:
      labels:
        app: loadgenerator
    spec:
      serviceAccountName: loadgenerator
      terminationGracePeriodSeconds: 5
      restartPolicy: Always
      
      # 1. 프론트엔드가 떴는지 먼저 확인하는 정찰병
      initContainers:
      - name: frontend-check
        image: busybox:latest
        command:
        - /bin/sh
        - -exc
        - |
          MAX_RETRIES=12
          RETRY_INTERVAL=10

          # 포트가 없을 경우를 대비해 기본값(80) 설정 (셸 파라미터 확장 문법)
          TARGET_URL="http://${FRONTEND_ADDR}"

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Pinging frontend: ${TARGET_URL}..."
            
            # wget으로 상태 코드만 추출
            STATUSCODE=$(wget --server-response ${TARGET_URL} 2>&1 | awk '/^  HTTP/{print $2}')
            
            if [ "$STATUSCODE" = "200" ]; then
                echo "Frontend is reachable."
                exit 0
            fi
            echo "Error: Could not reach frontend - Status code: ${STATUSCODE}"
            sleep $RETRY_INTERVAL
          done
          echo "Failed to reach frontend after $MAX_RETRIES attempts."
          exit 1
        env:
        - name: FRONTEND_ADDR
          valueFrom:
            configMapKeyRef:
              name: aws-global-env
              key: FRONTEND_ADDR  # 예: 100.88.181.49

          
      # 2. 본진 (실제 트래픽을 쏘는 녀석)
      containers:
      - name: main
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/loadgenerator:v0.10.5
        env:
        - name: FRONTEND_ADDR
          valueFrom:
            configMapKeyRef:
              name: aws-global-env  # 🔥 동일하게 수정
              key: FRONTEND_ADDR
        - name: USERS
          value: "10"
        - name: RATE
          value: "1"
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
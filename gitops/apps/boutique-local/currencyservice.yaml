# emailservice.yaml
apiVersion: v1
kind: Service
metadata:
  name: emailservice
spec:
  type: NodePort
  selector:
    app: emailservice
  ports:
  - name: grpc
    port: 5000
    targetPort: 8080
    nodePort: 35000 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
spec:
  selector:
    matchLabels:
      app: emailservice
  template:
    metadata:
      labels:
        app: emailservice
    spec:
      containers:
      - name: server
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/emailservice:v0.10.5
        ports:
        - containerPort: 8080
        env:
        # 🔥 마법 적용: ConfigMap에서 AWS 마스터 IP를 꺼내옵니다. (반드시 제일 위에 선언해야 아래에서 쓸 수 있음)
        - name: AWS_MASTER_IP
          valueFrom:
            configMapKeyRef:
              name: global-env
              key: AWS_MASTER_IP
        - name: PORT
          value: "8080"
        # 🔥 $(변수명) 문법으로 IP와 포트 번호를 자동 조립!
        - name: KAFKA_BROKER_URL
          value: "$(AWS_MASTER_IP):32092" 
        - name: KAFKA_TOPIC
          value: "orders"
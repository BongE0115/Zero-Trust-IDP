# emailservice.yaml
apiVersion: v1
kind: Service
metadata:
  name: emailservice
spec:
  type: NodePort
  selector:
    app: emailservice
  ports:
  - name: grpc
    port: 5000
    targetPort: 8080
    nodePort: 30500 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
spec:
  selector:
    matchLabels:
      app: emailservice
  template:
    metadata:
      labels:
        app: emailservice
    spec:
      containers:
      - name: server
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/emailservice:v0.10.5
        ports:
        - containerPort: 8080
        env:
        - name: AWS_MASTER_IP
          valueFrom:
            configMapKeyRef:
              name: aws-global-env # 🔥 'global-env'에서 'aws-global-env'로 수정
              key: LOCAL_TAILSCALE_IP # 🔥 'AWS_MASTER_IP'에서 실제 키 이름으로 수정
        - name: PORT
          value: "8080"
        - name: KAFKA_BROKER_URL
          value: "$(AWS_MASTER_IP):32092" 
        - name: KAFKA_TOPIC
          value: "orders"
        - name: DISABLE_PROFILER
          value: "1"
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd # ArgoCD가 설치된 네임스페이스
spec:
  project: default
  source:
    repoURL: 'https://fluent.github.io/helm-charts'
    chart: fluent-bit
    targetRevision: 0.43.0
    helm:
      values: |
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        
        config:
          service: |
            [SERVICE]
                Flush         1
                Log_Level     info
                Daemon        off
                Parsers_File  parsers.conf
                HTTP_Server   On
                HTTP_Listen   0.0.0.0
                HTTP_Port     2020
        
          inputs: |
            [INPUT]
                Name                tail
                Tag                 kube.*
                Path                /var/log/containers/*.log
                Parser              docker
                Docker_Mode         On
                Mem_Buf_Limit       50MB
                Skip_Long_Lines     On
        
          filters: |
            [FILTER]
                Name                kubernetes
                Match               kube.*
                Kube_URL            https://kubernetes.default.svc:443
                Merge_Log           On
                Keep_Log            Off
                K8S-Logging.Parser  On
                K8S-Logging.Exclude Off
        
            [FILTER]
                Name    grep
                Match   kube.*
                Exclude $kubernetes['namespace_name'] ^(logging|kafka-poc|kube-system|argocd|istio-system|forensic-sandbox)$
        
          outputs: |
            [OUTPUT]
                Name        kafka
                Match       kube.*
                Brokers     kafka.kafka-poc.svc.cluster.local:9092
                Topics      orders
                Format      json
                Retry_Limit 5
                client_id   fluent-bit-aiops

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # 🔥 테라폼 없이도 logging 네임스페이스를 자동 생성!
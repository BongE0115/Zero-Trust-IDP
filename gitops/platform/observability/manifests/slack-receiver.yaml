# 1. 수신 요원 파드 (Deployment)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-receiver
  namespace: kafka-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slack-receiver
  template:
    metadata:
      labels:
        app: slack-receiver
    spec:
      containers:
        - name: slack-receiver
          image: ghcr.io/bonge0115/slack-receiver:1552a15
          ports:
            - containerPort: 5001
          env:
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slack-credentials
                  key: SLACK_BOT_TOKEN
            - name: SLACK_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: slack-credentials
                  key: SLACK_CHANNEL
            - name: GITHUB_OWNER
              value: "BongE0115"
            - name: GITHUB_REPO
              value: "Zero-Trust-IDP"
            - name: GITHUB_REF
              value: "jy"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-dispatch-secret
                  key: token
---
# 2. 네트워크 길잡이 (Service - 아까 만드신 것)
apiVersion: v1
kind: Service
metadata:
  name: slack-receiver-svc
  namespace: kafka-poc
spec:
  type: NodePort
  selector:
    app: slack-receiver
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30082

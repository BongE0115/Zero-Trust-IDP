name: reproduce-sandbox

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Unique case identifier"
        required: true
        type: string
      namespace:
        description: "Namespace where launcher job runs"
        required: false
        default: "forensic-sandbox"
        type: string
      replay_topic:
        description: "Replay topic for this case"
        required: true
        type: string
      result_topic:
        description: "Result topic for this case"
        required: true
        type: string
      failure_artifact_json:
        description: "Failure replay artifact JSON"
        required: true
        type: string
      normal_artifact_json:
        description: "Normal validation artifact JSON"
        required: true
        type: string

permissions:
  contents: write

env:
  RECORD_BRANCH: jy
  LAUNCHER_IMAGE_REF: ghcr.io/bonge0115/forensic-launcher:latest
  OUTPUT_DIR: gitops/apps/forensic-sandbox/cases/reproduce

jobs:
  render-reproduce-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo

          CASE_ID="${{ inputs.case_id }}"
          if [[ ! "$CASE_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid case_id: $CASE_ID"
            exit 1
          fi

      - name: Checkout jy branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECORD_BRANCH }}
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          set -euo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build reproduce launcher manifest
        id: render
        shell: bash
        run: |
          set -euo

          SAFE_PREFIX="$(echo "${{ inputs.case_id }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//' | cut -c1-28)"
          if [[ -z "$SAFE_PREFIX" ]]; then
            SAFE_PREFIX="case"
          fi

          CASE_HASH="$(printf '%s' "${{ inputs.case_id }}" | sha256sum | cut -c1-8)"
          JOB_NAME="forensic-reproduce-${SAFE_PREFIX}-${CASE_HASH}"

          OUTPUT_PATH="${{ env.OUTPUT_DIR }}/reproduce-case-${{ inputs.case_id }}.yaml"

          mkdir -p "$(dirname "$OUTPUT_PATH")"

          cat > "$OUTPUT_PATH" <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB_NAME}
            namespace: ${{ inputs.namespace }}
            labels:
              app: ${JOB_NAME}
              forensic-case-id: ${{ inputs.case_id }}
              forensic-validation-mode: reproduce
              forensic-revalidation-generation: "0"
              forensic-job-hash: "${CASE_HASH}"
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 86400
            template:
              metadata:
                labels:
                  app: ${JOB_NAME}
                  forensic-case-id: ${{ inputs.case_id }}
                  forensic-validation-mode: reproduce
                  forensic-revalidation-generation: "0"
                  forensic-job-hash: "${CASE_HASH}"
              spec:
                restartPolicy: Never
                initContainers:
                  - name: artifact-init
                    image: busybox:1.36
                    imagePullPolicy: IfNotPresent
                    command:
                      - /bin/sh
                      - -c
                      - |
                        mkdir -p /artifacts
                        printf '%s' '${{ inputs.failure_artifact_json }}' > /artifacts/failure.json
                        printf '%s' '${{ inputs.normal_artifact_json }}' > /artifacts/normal.json
                        printf '%s' '{"ready": true, "case_id": "${{ inputs.case_id }}", "source_topic": "${{ inputs.replay_topic }}", "source": "workflow_wait"}' > /artifacts/consumer-ready.json
                    volumeMounts:
                      - name: artifacts
                        mountPath: /artifacts
                containers:
                  - name: forensic-launcher
                    image: ${{ env.LAUNCHER_IMAGE_REF }}
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: KAFKA_BOOTSTRAP
                        value: kafka.kafka-poc.svc.cluster.local:9092
                      - name: CASE_ID
                        value: ${{ inputs.case_id }}
                      - name: REPLAY_TOPIC
                        value: ${{ inputs.replay_topic }}
                      - name: RESULT_TOPIC
                        value: ${{ inputs.result_topic }}
                      - name: RESULT_GROUP_ID
                        value: forensic-launcher-reproduce
                      - name: FAILURE_ARTIFACT_PATH
                        value: /artifacts/failure.json
                      - name: NORMAL_ARTIFACT_PATH
                        value: /artifacts/normal.json
                      - name: VERDICT_FILE_PATH
                        value: /artifacts/verdict.json
                      - name: ENABLE_NORMAL_VALIDATION
                        value: "true"
                      - name: READY_FILE_PATH
                        value: /artifacts/consumer-ready.json
                      - name: READY_WAIT_SECONDS
                        value: "5"
                      - name: BETWEEN_FAILURE_AND_NORMAL_SECONDS
                        value: "5"
                      - name: RESULT_WAIT_SECONDS
                        value: "60"
                      - name: EXPECTED_FAILURE_ERROR_TYPE
                        value: ""
                      - name: ISOLATION_MODE
                        value: sandbox_strict
                      - name: ALLOWED_REPLAY_TOPIC
                        value: ${{ inputs.replay_topic }}
                      - name: ALLOWED_RESULT_TOPIC
                        value: ${{ inputs.result_topic }}
                      - name: VALIDATION_MODE
                        value: reproduce
                      - name: VALIDATION_RUN_ID
                        value: reproduce-${{ inputs.case_id }}-0
                      - name: REVALIDATION_GENERATION
                        value: "0"
                      - name: EXPECTED_FAILURE_STATUS
                        value: failed
                      - name: EXPECTED_NORMAL_STATUS
                        value: success
                      - name: POST_VERDICT_SLEEP_SECONDS
                        value: "300"
                      - name: IMAGE_REF
                        value: ${{ env.LAUNCHER_IMAGE_REF }}
                    volumeMounts:
                      - name: artifacts
                        mountPath: /artifacts
                volumes:
                  - name: artifacts
                    emptyDir: {}
          EOF

          echo "output_path=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"
          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"
          echo "case_hash=$CASE_HASH" >> "$GITHUB_OUTPUT"

      - name: Update jy case record metadata
        shell: bash
        run: |
          set -euo
          python3 scripts/update_case_record.py update \
            --case-id "${{ inputs.case_id }}" \
            --metadata-json "{\"reproduce_job_manifest_path\": \"${{ steps.render.outputs.output_path }}\", \"reproduce_job_name\": \"${{ steps.render.outputs.job_name }}\"}" \
            --note "initial reproduce launcher manifest created"

      - name: Commit reproduce launcher manifest and record
        shell: bash
        run: |
          set -euo

          git add "${{ steps.render.outputs.output_path }}"
          git add "gitops/apps/forensic-sandbox/cases/records/${{ inputs.case_id }}.json"

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(case): request reproduce launcher for ${{ inputs.case_id }}"

      - name: Push jy branch
        shell: bash
        run: |
          set -euo

          BRANCH="${{ env.RECORD_BRANCH }}"

          for attempt in 1 2 3 4 5; do
            echo "[INFO] push attempt ${attempt}"

            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              echo "[WARN] rebase conflict detected, aborting rebase"
              git rebase --abort || true
              exit 1
            fi

            if git push origin "HEAD:${BRANCH}"; then
              echo "[OK] push succeeded"
              exit 0
            fi

            echo "[WARN] push rejected, retrying..."
            sleep $((attempt * 2))
          done

          echo "[ERROR] failed to push after multiple attempts"
          exit 1

      - name: Force Argo refresh for reproduce app
        shell: bash
        env:
          KUBECONFIG_B64_VALUE: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.kube"
          echo "${KUBECONFIG_B64_VALUE}" | base64 -di > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

          kubectl -n argocd annotate application forensic-sandbox-reproduce \
            argocd.argoproj.io/refresh=hard --overwrite

      - name: Force Argo sync for reproduce app
        shell: bash
        env:
          KUBECONFIG_B64_VALUE: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.kube"
          echo "${KUBECONFIG_B64_VALUE}" | base64 -di > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

          kubectl -n argocd patch application forensic-sandbox-reproduce --type merge -p '
          {
            "operation": {
              "sync": {
                "prune": true
              }
            }
          }'

  snapshot-and-collect-reproduce:
    needs: render-reproduce-manifest
    runs-on: [self-hosted, linux, monitoring-node]

    steps:
      - name: Checkout jy branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECORD_BRANCH }}
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          set -euo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64_VALUE: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo
          mkdir -p "${HOME}/.kube"

          if [[ -z "${KUBECONFIG_B64_VALUE:-}" ]]; then
            echo "KUBECONFIG_B64 secret is empty or missing"
            exit 1
          fi

          echo "${KUBECONFIG_B64_VALUE}" | base64 -di > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Wait for reproduce app to sync
        shell: bash
        run: |
          set -euo

          for i in $(seq 1 90); do
            SYNC_STATUS="$(kubectl get application forensic-sandbox-reproduce -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
            HEALTH_STATUS="$(kubectl get application forensic-sandbox-reproduce -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || true)"

            echo "[INFO] reproduce app sync=${SYNC_STATUS} health=${HEALTH_STATUS} (${i}/90)"

            if [[ "$SYNC_STATUS" == "Synced" || "$HEALTH_STATUS" == "Progressing" || "$HEALTH_STATUS" == "Healthy" || "$HEALTH_STATUS" == "Degraded" ]]; then
              break
            fi

            sleep 5
          done

      - name: Resolve reproduce pod by case_id label only
        id: pod
        shell: bash
        run: |
          set -euo

          NS="${{ inputs.namespace }}"
          CASE_ID="${{ inputs.case_id }}"
          GEN="0"

          SELECTOR="forensic-case-id=${CASE_ID},forensic-validation-mode=reproduce,forensic-revalidation-generation=${GEN}"

          for i in $(seq 1 90); do
            POD_NAME="$(kubectl get pods -n "$NS" -l "$SELECTOR" \
              --sort-by=.metadata.creationTimestamp \
              -o jsonpath='{.items[-1:].metadata.name}' 2>/dev/null || true)"

            if [[ -n "${POD_NAME:-}" ]]; then
              echo "pod_name=$POD_NAME" >> "$GITHUB_OUTPUT"
              echo "selector=$SELECTOR" >> "$GITHUB_OUTPUT"
              echo "[OK] reproduce pod found by case_id label: $POD_NAME"
              exit 0
            fi

            echo "[INFO] reproduce pod not found yet for selector=${SELECTOR} (${i}/90)"
            sleep 5
          done

          echo "[ERROR] reproduce pod not found for selector=${SELECTOR}"
          kubectl get pods -n "$NS" --show-labels || true
          kubectl get jobs -n "$NS" || true
          kubectl describe application forensic-sandbox-reproduce -n argocd || true
          exit 1

      - name: Wait for verdict file
        shell: bash
        run: |
          set -euo

          NS="${{ inputs.namespace }}"
          POD="${{ steps.pod.outputs.pod_name }}"

          for i in $(seq 1 90); do
            PHASE="$(kubectl get pod -n "$NS" "$POD" -o jsonpath='{.status.phase}')"
            echo "[INFO] pod phase=$PHASE"

            if kubectl exec -n "$NS" "$POD" -c forensic-launcher -- test -f /artifacts/verdict.json 2>/dev/null; then
              echo "[OK] verdict file exists"
              exit 0
            fi

            if [[ "$PHASE" == "Failed" || "$PHASE" == "Succeeded" ]]; then
              echo "[WARN] pod finished before verdict fetch"
              kubectl logs -n "$NS" "$POD" -c forensic-launcher --tail=200 || true
              kubectl describe pod -n "$NS" "$POD" || true
            fi

            sleep 5
          done

          echo "[ERROR] Timed out waiting for verdict.json"
          kubectl logs -n "$NS" "$POD" -c forensic-launcher --tail=200 || true
          kubectl describe pod -n "$NS" "$POD" || true
          exit 1

      - name: Fetch verdict.json from reproduce pod
        shell: bash
        run: |
          set -euo

          NS="${{ inputs.namespace }}"
          POD="${{ steps.pod.outputs.pod_name }}"

          mkdir -p /tmp/reproduce-verdict
          kubectl exec -n "$NS" "$POD" -c forensic-launcher -- cat /artifacts/verdict.json > /tmp/reproduce-verdict/verdict.json

          test -s /tmp/reproduce-verdict/verdict.json

      - name: Export verdict snapshot into repo path on jy
        shell: bash
        run: |
          set -euo

          python3 scripts/export_verdict_snapshot.py \
            --case-id "${{ inputs.case_id }}" \
            --input-verdict "/tmp/reproduce-verdict/verdict.json" \
            --annotate-source-path

      - name: Collect reproduce verdict into jy case record
        shell: bash
        run: |
          set -euo

          CASE_ID="${{ inputs.case_id }}"
          VERDICT_PATH="gitops/apps/forensic-sandbox/cases/verdicts/${CASE_ID}.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          case_id = os.environ["CASE_ID"]
          verdict_path = Path(os.environ["VERDICT_PATH"])
          record_path = Path(f"gitops/apps/forensic-sandbox/cases/records/{case_id}.json")

          if not verdict_path.exists():
              raise SystemExit(f"verdict file not found: {verdict_path}")
          if not record_path.exists():
              raise SystemExit(f"case record not found: {record_path}")

          verdict = json.loads(verdict_path.read_text(encoding="utf-8"))
          record = json.loads(record_path.read_text(encoding="utf-8"))

          flags = record.setdefault("flags", {})
          metadata = record.setdefault("metadata", {})
          history = record.setdefault("history", [])

          overall_passed = bool(verdict.get("overall_passed", False))
          validation_mode = verdict.get("validation_mode", "reproduce")
          validation_run_id = verdict.get("validation_run_id", "")
          generation = int(verdict.get("revalidation_generation", 0))

          flags["reproduce_verdict_collected"] = True
          flags["reproduced"] = overall_passed

          metadata["last_reproduce_verdict_path"] = str(verdict_path)
          metadata["last_reproduce_overall_passed"] = overall_passed
          metadata["last_reproduce_validation_mode"] = validation_mode
          metadata["last_reproduce_validation_run_id"] = validation_run_id
          metadata["last_reproduce_generation"] = generation

          record["status"] = "reproduced" if overall_passed else "reproduce_failed"

          history.append({
              "event": "collect_reproduce_result",
              "case_id": case_id,
              "overall_passed": overall_passed,
              "validation_mode": validation_mode,
              "validation_run_id": validation_run_id,
              "generation": generation,
              "verdict_path": str(verdict_path),
          })

          record_path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"[OK] reproduce verdict collected case_id={case_id} overall_passed={overall_passed}")
          PY
        env:
          CASE_ID: ${{ inputs.case_id }}
          VERDICT_PATH: gitops/apps/forensic-sandbox/cases/verdicts/${{ inputs.case_id }}.json

      - name: Commit verdict snapshot and updated record on jy
        shell: bash
        run: |
          set -euo

          git add "gitops/apps/forensic-sandbox/cases/verdicts/${{ inputs.case_id }}.json"
          git add "gitops/apps/forensic-sandbox/cases/records/${{ inputs.case_id }}.json"

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(case): snapshot and collect reproduce result for ${{ inputs.case_id }}"

      - name: Push jy branch
        shell: bash
        run: |
          set -euo

          BRANCH="${{ env.RECORD_BRANCH }}"

          for attempt in 1 2 3 4 5; do
            echo "[INFO] push attempt ${attempt}"

            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              echo "[WARN] rebase conflict detected, aborting rebase"
              git rebase --abort || true
              exit 1
            fi

            if git push origin "HEAD:${BRANCH}"; then
              echo "[OK] push succeeded"
              exit 0
            fi

            echo "[WARN] push rejected, retrying..."
            sleep $((attempt * 2))
          done

          echo "[ERROR] failed to push after multiple attempts"
          exit 1
name: build-case-candidate

on:
  push:
    branches:
      - "case/**"
    paths:
      - "services/worker-consumer/**"
      - "scripts/patch_case_candidate.py"
      - "scripts/update_case_record.py"

permissions:
  contents: write
  packages: write
  actions: write

env:
  RECORD_BRANCH: jy
  KAFKA_BOOTSTRAP: kafka.kafka-poc.svc.cluster.local:9092
  REVALIDATION_NAMESPACE: forensic-sandbox
  REVALIDATION_WORKFLOW_FILE: revalidate-sandbox.yaml

jobs:
  build-case-candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout case branch source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: case-src

      - name: Parse case_id from branch
        id: parse
        shell: bash
        run: |
          set -euo pipefail

          REF_NAME="${GITHUB_REF_NAME}"

          if [[ ! "$REF_NAME" =~ ^case/(.+)$ ]]; then
            echo "Not a case branch: $REF_NAME"
            exit 1
          fi

          CASE_ID="${BASH_REMATCH[1]}"

          if [[ ! "$CASE_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid case_id: $CASE_ID"
            exit 1
          fi

          echo "case_id=$CASE_ID" >> "$GITHUB_OUTPUT"
          echo "case_branch=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Normalize image repository
        id: image_repo
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_name=ghcr.io/${OWNER_LC}/worker-consumer" >> "$GITHUB_OUTPUT"

      - name: Configure git in case source
        working-directory: case-src
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: case-src/services/worker-consumer
          file: case-src/services/worker-consumer/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.image_repo.outputs.image_name }}:case-${{ steps.parse.outputs.case_id }}-${{ steps.parse.outputs.short_sha }}

      - name: Resolve digest-pinned image ref
        id: digest
        shell: bash
        run: |
          set -euo pipefail

          DIGEST="${{ steps.build_push.outputs.digest }}"
          if [[ -z "$DIGEST" ]]; then
            echo "Missing digest from build step"
            exit 1
          fi

          IMAGE_REF="${{ steps.image_repo.outputs.image_name }}@${DIGEST}"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout jy record branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECORD_BRANCH }}
          fetch-depth: 0
          path: record-repo

      - name: Configure git on jy record branch
        working-directory: record-repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read sandbox manifest path and generation from jy case record
        id: record
        working-directory: record-repo
        shell: bash
        run: |
          set -euo pipefail

          CASE_ID="${{ steps.parse.outputs.case_id }}"
          export CASE_ID
          RECORD_PATH="gitops/apps/forensic-sandbox/cases/records/${CASE_ID}.json"
          export RECORD_PATH

          if [[ ! -f "$RECORD_PATH" ]]; then
            echo "Case record not found on jy: $RECORD_PATH"
            exit 1
          fi

          SANDBOX_MANIFEST_PATH="$(
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RECORD_PATH"])
          data = json.loads(path.read_text(encoding="utf-8"))
          print(data.get("sandbox_manifest_path") or "")
          PY
          )"

          if [[ -z "$SANDBOX_MANIFEST_PATH" ]]; then
            echo "sandbox_manifest_path is empty in jy case record"
            exit 1
          fi

          CURRENT_GEN="$(
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RECORD_PATH"])
          data = json.loads(path.read_text(encoding="utf-8"))
          print(int(data.get("revalidation_generation", 0)))
          PY
          )"

          NEXT_GEN=$((CURRENT_GEN + 1))

          echo "sandbox_manifest_path=$SANDBOX_MANIFEST_PATH" >> "$GITHUB_OUTPUT"
          echo "current_generation=$CURRENT_GEN" >> "$GITHUB_OUTPUT"
          echo "next_generation=$NEXT_GEN" >> "$GITHUB_OUTPUT"

      - name: Patch sandbox manifest and jy case record
        working-directory: record-repo
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/patch_case_candidate.py \
            --case-id "${{ steps.parse.outputs.case_id }}" \
            --manifest-path "${{ steps.record.outputs.sandbox_manifest_path }}" \
            --candidate-image-ref "${{ steps.digest.outputs.image_ref }}" \
            --generation "${{ steps.record.outputs.next_generation }}" \
            --set-case-configmap \
            --update-record \
            --note "candidate image built from case branch ${{ steps.parse.outputs.case_branch }}"

      - name: Force-sync critical record fields after patch
        working-directory: record-repo
        shell: bash
        env:
          CASE_ID: ${{ steps.parse.outputs.case_id }}
          NEXT_GEN: ${{ steps.record.outputs.next_generation }}
          CANDIDATE_IMAGE_REF: ${{ steps.digest.outputs.image_ref }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          case_id = os.environ["CASE_ID"]
          next_gen = int(os.environ["NEXT_GEN"])
          candidate_image_ref = os.environ["CANDIDATE_IMAGE_REF"]

          record_path = Path(f"gitops/apps/forensic-sandbox/cases/records/{case_id}.json")
          if not record_path.exists():
              raise SystemExit(f"case record not found: {record_path}")

          record = json.loads(record_path.read_text(encoding="utf-8"))
          record["status"] = "candidate_built"
          record["candidate_image_ref"] = candidate_image_ref
          record["revalidation_generation"] = next_gen
          record["updated_at"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          flags = record.setdefault("flags", {})
          flags["revalidation_passed"] = False
          flags["promoted"] = False
          flags["redriven"] = False
          flags["resolved"] = False

          metadata = record.setdefault("metadata", {})
          metadata["candidate_build_branch"] = record.get("branch_name", "")
          metadata["candidate_build_generation"] = next_gen

          history = record.setdefault("history", [])
          history.append({
              "at": record["updated_at"],
              "action": "update",
              "status": "candidate_built",
              "note": "force-synced record after candidate patch",
              "extra": {
                  "candidate_image_ref": candidate_image_ref,
                  "revalidation_generation": next_gen
              }
          })

          record_path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"[OK] synced record generation={next_gen} case_id={case_id}")
          PY

      - name: Read revalidation inputs from patched sandbox manifest
        id: reval_inputs
        working-directory: record-repo
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.record.outputs.sandbox_manifest_path }}
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/reval_inputs.txt
          import os
          import re
          from pathlib import Path

          manifest_path = Path(os.environ["MANIFEST_PATH"])
          text = manifest_path.read_text(encoding="utf-8")

          def find_required(pattern: str, name: str) -> str:
              m = re.search(pattern, text, re.MULTILINE)
              if not m:
                  raise SystemExit(f"missing {name} in {manifest_path}")
              return m.group(1).strip().strip("'").strip('"')

          replay_topic = find_required(r'^\s*replay_topic:\s*(.+?)\s*$', "replay_topic")
          result_topic = find_required(r'^\s*result_topic:\s*(.+?)\s*$', "result_topic")

          print(f"replay_topic={replay_topic}")
          print(f"result_topic={result_topic}")
          PY

          cat /tmp/reval_inputs.txt >> "$GITHUB_OUTPUT"

      - name: Commit updated sandbox manifest and jy case record
        working-directory: record-repo
        shell: bash
        run: |
          set -euo pipefail

          git add "${{ steps.record.outputs.sandbox_manifest_path }}"
          git add "gitops/apps/forensic-sandbox/cases/records/${{ steps.parse.outputs.case_id }}.json"

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(case): patch candidate image for ${{ steps.parse.outputs.case_id }}"

      - name: Push jy record branch updates
        working-directory: record-repo
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ env.RECORD_BRANCH }}"

          for attempt in 1 2 3 4 5; do
            echo "[INFO] push attempt ${attempt}"

            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              echo "[WARN] rebase conflict detected, aborting rebase"
              git rebase --abort || true
              exit 1
            fi

            if git push origin "HEAD:${BRANCH}"; then
              echo "[OK] push succeeded"
              exit 0
            fi

            echo "[WARN] push failed due to concurrent updates, retrying..."
            sleep $((attempt * 2))
          done

          echo "[ERROR] failed to push after multiple attempts"
          exit 1

      - name: Check gh cli
        shell: bash
        run: |
          set -euo pipefail
          gh --version

      - name: Dispatch unified revalidate-sandbox workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh workflow run "${{ env.REVALIDATION_WORKFLOW_FILE }}" \
            --ref "${{ env.RECORD_BRANCH }}" \
            -f case_id="${{ steps.parse.outputs.case_id }}" \
            -f generation="${{ steps.record.outputs.next_generation }}" \
            -f replay_topic="${{ steps.reval_inputs.outputs.replay_topic }}" \
            -f result_topic="${{ steps.reval_inputs.outputs.result_topic }}" \
            -f kafka_bootstrap="${{ env.KAFKA_BOOTSTRAP }}" \
            -f namespace="${{ env.REVALIDATION_NAMESPACE }}" \
            -f note="revalidation requested automatically after candidate build"
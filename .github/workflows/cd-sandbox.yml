name: 🛡️🚀 Unified Sandbox Operations (GitOps & JIT)

# 슬랙이나 외부 API에서 날아오는 3가지 신호를 모두 이 파일 하나로 받습니다.
on:
  repository_dispatch:
    types: [deploy-sandbox, trigger-jit-debug, cleanup_pod]

jobs:
  # ==========================================
  # 🟢 JOB 1: 인프라 프로비저닝 (GitOps 스케일 업)
  # 조건: 'deploy-sandbox' 신호가 올 때만 실행됩니다.
  # ==========================================
  provision-sandbox:
    if: github.event.action == 'deploy-sandbox'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Git에 커밋하고 푸시할 수 있는 권한 부여
    steps:
      - name: 📥 소스 코드 가져오기
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 요청 정보 확인 (Logging)
        run: |
          echo "🚨 샌드박스 배포 요청 수신!"
          echo "요청자: ${{ github.event.client_payload.triggered_by }}"
          echo "Action: ${{ github.event.client_payload.action }}"

      - name: 🛠️ GitOps 매니페스트 수정 (Scale Up 0 -> 1)
        run: |
          echo "샌드박스 및 MongoDB의 replicas를 1로 변경합니다."
          
          # 1. 샌드박스 앱 스케일 업
          sed -i 's/replicas: 0/replicas: 1/g' gitops/apps/forensic-sandbox/manifests/sandbox-app.yaml
          
          # 2. 임시 MongoDB 스케일 업
          sed -i 's/replicas: 0/replicas: 1/g' gitops/apps/forensic-sandbox/manifests/mongodb-temp.yaml

      - name: 💾 Git 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 변경사항이 있는지 확인 후 커밋
          if [[ -n $(git status -s) ]]; then
            git add gitops/apps/forensic-sandbox/manifests/sandbox-app.yaml
            git add gitops/apps/forensic-sandbox/manifests/mongodb-temp.yaml
            git commit -m "Auto-scaling Forensic Sandbox to replicas: 1 (Requested by ${{ github.event.client_payload.triggered_by }})"
            git push
            echo "✅ Git Push 성공! 이제 ArgoCD가 샌드박스를 배포합니다."
          else
            echo "⚠️ 변경사항이 없습니다. 이미 샌드박스가 켜져 있을 수 있습니다."
          fi


  # ==========================================
  # 🔴 JOB 2: JIT 보안 통제 및 디버깅 
  # 조건: 'trigger-jit-debug' 또는 'cleanup_pod' 신호가 올 때만 실행됩니다.
  # ==========================================
  jit-security-debug:
    if: github.event.action == 'trigger-jit-debug' || github.event.action == 'cleanup_pod'
    runs-on: ubuntu-latest
    steps:
      - name: 🔐 K8s 클러스터 접속
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      # 1. [공통] 기존 임시 권한 초기화 (혹시 남아있을지 모를 찌꺼기 제거)
      - name: 🧹 Pre-Cleanup
        run: |
          kubectl delete authorizationpolicy sandbox-jit-access -n forensic-sandbox --ignore-not-found
          kubectl delete authorizationpolicy allow-sandbox-to-kafka -n kafka-poc --ignore-not-found

      # 2. [디버깅 모드 전용] 자물쇠 해제 및 임시 권한 발급
      - name: 🔓 Unlock & Open Firewall
        if: github.event.action == 'trigger-jit-debug'
        run: |
          echo "디버깅 모드: 자물쇠를 해제하고 임시 포트를 개방합니다."
          # 자물쇠(DENY) 제거
          kubectl delete authorizationpolicy block-everything-sandbox -n forensic-sandbox --ignore-not-found
          # 열쇠(ALLOW) 삽입
          cat <<EOF | kubectl apply -f -
          apiVersion: security.istio.io/v1beta1
          kind: AuthorizationPolicy
          metadata:
            name: sandbox-jit-access
            namespace: forensic-sandbox
          spec:
            selector:
              matchLabels:
                app: forensic-sandbox-app
            action: ALLOW
            rules:
            - to:
              - operation:
                  ports: ["8080", "27017", "53"]
          ---
          apiVersion: security.istio.io/v1beta1
          kind: AuthorizationPolicy
          metadata:
            name: allow-sandbox-to-kafka
            namespace: kafka-poc
          spec:
            action: ALLOW
            rules:
            - from:
              - source:
                  namespaces: ["forensic-sandbox"]
              to:
              - operation:
                  ports: ["9092"]
          EOF
          sleep 5

      # 3. [디버깅 모드 전용] 패킷 캡처 및 슬랙 전송
      - name: 🛠️ Debugging & Packet Capture
        if: github.event.action == 'trigger-jit-debug'
        run: |
          POD_NAME=${{ github.event.client_payload.pod_name }}
          PORT=${{ github.event.client_payload.target_port }}
          kubectl debug -n forensic-sandbox $POD_NAME --image=nicolaka/netshoot --container=debugger --target=consumer-app || true
          sleep 5
          kubectl exec -n forensic-sandbox $POD_NAME -c debugger -- timeout 30 tcpdump -i eth0 port $PORT -w /tmp/capture.pcap || true
          kubectl cp forensic-sandbox/$POD_NAME:/tmp/capture.pcap ./capture.pcap -c debugger

      - name: 📤 Upload to Slack
        if: github.event.action == 'trigger-jit-debug'
        uses: adrey/slack-file-upload-action@master
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          path: ./capture.pcap
          channel: "알림_채널"
          initial_comment: "🚨 JIT 디버깅 결과물입니다."

      # 4. [공통] 무조건 실행: 자물쇠 복구 및 파드 강제 교체
      # 'if: always()' 덕분에 중간에 캡처가 실패해도 문은 무조건 잠깁니다.
      - name: 🔒 Final Lockdown & Cleanup
        if: always()
        run: |
          echo "보안 복구 모드: 모든 임시 권한을 삭제하고 자물쇠를 다시 채웁니다."
          # 임시 ALLOW 정책 삭제
          kubectl delete authorizationpolicy sandbox-jit-access -n forensic-sandbox --ignore-not-found
          kubectl delete authorizationpolicy allow-sandbox-to-kafka -n kafka-poc --ignore-not-found
          
          # 자물쇠(DENY) 재생성
          cat <<EOF | kubectl apply -f -
          apiVersion: security.istio.io/v1beta1
          kind: AuthorizationPolicy
          metadata:
            name: block-everything-sandbox
            namespace: forensic-sandbox
          spec:
            selector:
              matchLabels:
                app: forensic-sandbox-app
            action: DENY
            rules:
            - {}
          EOF
          
          # 오염된 파드 폭파 (새 파드로 자동 교체)
          kubectl delete pod ${{ github.event.client_payload.pod_name }} -n forensic-sandbox --ignore-not-found

      - name: 📢 Slack Final Notify
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🛡️ *[JIT 보안 알림]* 요청하신 작업(${{ github.event.action }})이 완료되었습니다. 샌드박스는 다시 완전 격리 상태로 복구되었습니다."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
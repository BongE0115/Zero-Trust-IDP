name: collect-reproduce-result

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Unique case identifier"
        required: true
        type: string
      verdict_path:
        description: "Path to reproduce verdict JSON committed in repo"
        required: true
        type: string
      note:
        description: "Optional note"
        required: false
        default: "reproduce verdict collected by workflow"
        type: string

permissions:
  contents: write

env:
  RECORD_BRANCH: jy

jobs:
  collect-reproduce-result:
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          CASE_ID="${{ inputs.case_id }}"
          VERDICT_PATH="${{ inputs.verdict_path }}"

          if [[ ! "$CASE_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid case_id: $CASE_ID"
            exit 1
          fi

          if [[ -z "$VERDICT_PATH" ]]; then
            echo "verdict_path is required"
            exit 1
          fi

          EXPECTED_PREFIX="gitops/apps/forensic-sandbox/cases/verdicts/"
          if [[ "$VERDICT_PATH" != ${EXPECTED_PREFIX}* ]]; then
            echo "verdict_path must be under ${EXPECTED_PREFIX}"
            exit 1
          fi

          EXPECTED_PATH="${EXPECTED_PREFIX}${CASE_ID}.json"
          if [[ "$VERDICT_PATH" != "$EXPECTED_PATH" ]]; then
            echo "verdict_path mismatch: expected ${EXPECTED_PATH}, got ${VERDICT_PATH}"
            exit 1
          fi

      - name: Checkout jy record branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECORD_BRANCH }}
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify required files exist on jy
        shell: bash
        run: |
          set -euo pipefail

          RECORD_PATH="gitops/apps/forensic-sandbox/cases/records/${{ inputs.case_id }}.json"
          VERDICT_PATH="${{ inputs.verdict_path }}"

          if [[ ! -f "$RECORD_PATH" ]]; then
            echo "Case record not found on jy: $RECORD_PATH"
            exit 1
          fi

          if [[ ! -f "$VERDICT_PATH" ]]; then
            echo "Verdict file not found on jy: $VERDICT_PATH"
            exit 1
          fi

      - name: Collect reproduce verdict into jy case record
        shell: bash
        run: |
          set -euo pipefail

          CASE_ID="${{ inputs.case_id }}"
          VERDICT_PATH="${{ inputs.verdict_path }}"
          NOTE="${{ inputs.note }}"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          case_id = os.environ["CASE_ID"]
          verdict_path = Path(os.environ["VERDICT_PATH"])
          note = os.environ["NOTE"]

          record_path = Path(f"gitops/apps/forensic-sandbox/cases/records/{case_id}.json")
          record = json.loads(record_path.read_text(encoding="utf-8"))
          verdict = json.loads(verdict_path.read_text(encoding="utf-8"))

          flags = record.setdefault("flags", {})
          metadata = record.setdefault("metadata", {})
          history = record.setdefault("history", [])

          overall_passed = bool(verdict.get("overall_passed", False))
          validation_mode = verdict.get("validation_mode", "reproduce")
          validation_run_id = verdict.get("validation_run_id", "")
          generation = int(verdict.get("revalidation_generation", 0))

          flags["reproduced"] = overall_passed
          flags["reproduce_verdict_collected"] = True

          metadata["last_reproduce_verdict_path"] = str(verdict_path)
          metadata["last_reproduce_overall_passed"] = overall_passed
          metadata["last_reproduce_validation_mode"] = validation_mode
          metadata["last_reproduce_validation_run_id"] = validation_run_id
          metadata["last_reproduce_generation"] = generation
          metadata["last_reproduce_note"] = note

          if overall_passed:
              record["status"] = "reproduced"
          else:
              record["status"] = "reproduce_failed"

          history.append({
              "event": "collect_reproduce_result",
              "case_id": case_id,
              "overall_passed": overall_passed,
              "validation_mode": validation_mode,
              "validation_run_id": validation_run_id,
              "generation": generation,
              "verdict_path": str(verdict_path),
              "note": note,
          })

          record_path.write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"[OK] reproduce verdict collected into record case_id={case_id} overall_passed={overall_passed}")
          PY
        env:
          CASE_ID: ${{ inputs.case_id }}
          VERDICT_PATH: ${{ inputs.verdict_path }}
          NOTE: ${{ inputs.note }}

      - name: Commit updated jy case record
        shell: bash
        run: |
          set -euo pipefail

          git add "gitops/apps/forensic-sandbox/cases/records/${{ inputs.case_id }}.json"

          if git diff --cached --quiet; then
            echo "No case record changes to commit"
            exit 0
          fi

          git commit -m "chore(case): collect reproduce result for ${{ inputs.case_id }}"

      - name: Push jy branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${{ env.RECORD_BRANCH }}"
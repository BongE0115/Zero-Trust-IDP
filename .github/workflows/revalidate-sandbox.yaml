name: revalidate-sandbox

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Unique case identifier"
        required: true
        type: string
      generation:
        description: "Revalidation generation"
        required: true
        type: string
      launcher_image_ref:
        description: "Optional forensic-launcher image ref"
        required: false
        default: ""
        type: string
      replay_topic:
        description: "Replay topic for this case"
        required: true
        type: string
      result_topic:
        description: "Result topic for this case"
        required: true
        type: string
      kafka_bootstrap:
        description: "Kafka bootstrap address"
        required: false
        default: "kafka.kafka-poc.svc.cluster.local:9092"
        type: string
      namespace:
        description: "Namespace for revalidation job"
        required: false
        default: "forensic-sandbox"
        type: string
      note:
        description: "Optional note"
        required: false
        default: "revalidation requested by workflow"
        type: string

permissions:
  contents: write
  actions: write

env:
  RECORD_BRANCH: jy
  DEFAULT_LAUNCHER_IMAGE_REF: ghcr.io/bonge0115/forensic-launcher@sha256:8761ff728b2b4c3685c3d23f33d387edea99ef1f9581d28b32d155bdbac8c009

jobs:
  render-revalidation-manifest:
    runs-on: [self-hosted, linux, monitoring-node]

    steps:
      - name: Validate basic inputs
        shell: bash
        run: |
          set -euo pipefail

          CASE_ID="${{ inputs.case_id }}"
          GEN="${{ inputs.generation }}"

          if [[ ! "$CASE_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid case_id: $CASE_ID"
            exit 1
          fi

          if [[ ! "$GEN" =~ ^[0-9]+$ ]]; then
            echo "generation must be a non-negative integer"
            exit 1
          fi

      - name: Checkout jy branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECORD_BRANCH }}
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve launcher image ref
        id: launcher
        shell: bash
        env:
          INPUT_REF: ${{ inputs.launcher_image_ref }}
          DEFAULT_REF: ghcr.io/bonge0115/forensic-launcher@sha256:3792fe064586acae63b368913a01c31ed6da8b95329452855deb37700ca000cc
        run: |
          set -euo pipefail

          RESOLVED_REF="${INPUT_REF:-}"
          if [[ -z "$RESOLVED_REF" ]]; then
            RESOLVED_REF="$DEFAULT_REF"
          fi

          if [[ ! "$RESOLVED_REF" =~ ^.+@sha256:[a-f0-9]{64}$ ]]; then
            echo "[ERROR] launcher image ref must be digest-pinned: $RESOLVED_REF"
            exit 1
          fi

          echo "launcher_image_ref=$RESOLVED_REF" >> "$GITHUB_OUTPUT"
          echo "[INFO] resolved launcher image ref: $RESOLVED_REF"

      - name: Read jy case record
        id: record
        shell: bash
        run: |
          set -euo pipefail

          CASE_ID="${{ inputs.case_id }}"
          RECORD_PATH="gitops/apps/forensic-sandbox/cases/records/${CASE_ID}.json"

          if [[ ! -f "$RECORD_PATH" ]]; then
            echo "Case record not found on jy: $RECORD_PATH"
            exit 1
          fi

          export CASE_ID
          export RECORD_PATH
          export INPUT_GEN="${{ inputs.generation }}"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          case_id = os.environ["CASE_ID"]
          path = Path(os.environ["RECORD_PATH"])
          input_gen = int(os.environ["INPUT_GEN"])
          data = json.loads(path.read_text(encoding="utf-8"))

          candidate = data.get("candidate_image_ref")
          manifest = data.get("sandbox_manifest_path")
          flags = data.get("flags", {})

          if not candidate:
              raise SystemExit("candidate_image_ref is empty in jy case record")
          if not manifest:
              raise SystemExit("sandbox_manifest_path is empty in jy case record")
          if flags.get("resolved") is True:
              raise SystemExit("case is already resolved")

          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write(f"candidate_image_ref={candidate}\n")
              f.write(f"sandbox_manifest_path={manifest}\n")
              f.write(f"next_generation={input_gen}\n")
          PY

      - name: Resolve generation-scoped topics
        id: scoped_topics
        shell: bash
        run: |
          set -euo pipefail

          REPLAY_TOPIC="${{ inputs.replay_topic }}"
          RESULT_TOPIC_INPUT="${{ inputs.result_topic }}"
          GEN="${{ steps.record.outputs.next_generation }}"

          if [[ -z "$REPLAY_TOPIC" ]]; then
            echo "[ERROR] replay_topic is empty"
            exit 1
          fi

          if [[ -z "$RESULT_TOPIC_INPUT" ]]; then
            echo "[ERROR] result_topic is empty"
            exit 1
          fi

          RESULT_TOPIC_BASE="$(echo "$RESULT_TOPIC_INPUT" | sed -E 's/-g[0-9]+$//')"
          SCOPED_RESULT_TOPIC="${RESULT_TOPIC_BASE}-g${GEN}"

          echo "replay_topic=$REPLAY_TOPIC" >> "$GITHUB_OUTPUT"
          echo "result_topic=$SCOPED_RESULT_TOPIC" >> "$GITHUB_OUTPUT"

      - name: Render revalidation job manifest on jy
        id: render
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/render_revalidation_job.py \
            --case-id "${{ inputs.case_id }}" \
            --generation "${{ steps.record.outputs.next_generation }}" \
            --namespace "${{ inputs.namespace }}" \
            --validation-mode "fix-verify" \
            --kafka-bootstrap "${{ inputs.kafka_bootstrap }}" \
            --replay-topic "${{ steps.scoped_topics.outputs.replay_topic }}" \
            --result-topic "${{ steps.scoped_topics.outputs.result_topic }}" \
            --launcher-image-ref "${{ steps.launcher.outputs.launcher_image_ref }}" \
            --update-record \
            --note "${{ inputs.note }}"

      - name: Verify rendered revalidation manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="gitops/apps/forensic-sandbox/cases/revalidation/revalidate-case-${{ inputs.case_id }}.yaml"

          if [[ ! -f "$MANIFEST" ]]; then
            echo "[ERROR] rendered manifest not found: $MANIFEST"
            exit 1
          fi

          grep -q "forensic-case-id: ${{ inputs.case_id }}" "$MANIFEST" || {
            echo "[ERROR] missing forensic-case-id label in rendered manifest"
            exit 1
          }

          grep -q "forensic-validation-mode: fix-verify" "$MANIFEST" || {
            echo "[ERROR] missing fix-verify label in rendered manifest"
            exit 1
          }

      - name: Force-sync record generation after render
        shell: bash
        env:
          CASE_ID: ${{ inputs.case_id }}
          NEXT_GEN: ${{ steps.record.outputs.next_generation }}
          LAUNCHER_IMAGE_REF: ${{ steps.launcher.outputs.launcher_image_ref }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          case_id = os.environ["CASE_ID"]
          next_gen = int(os.environ["NEXT_GEN"])
          launcher_image_ref = os.environ["LAUNCHER_IMAGE_REF"]

          record_path = Path(f"gitops/apps/forensic-sandbox/cases/records/{case_id}.json")

          if not record_path.exists():
              raise SystemExit(f"case record not found: {record_path}")

          record = json.loads(record_path.read_text(encoding="utf-8"))
          record["revalidation_generation"] = next_gen
          record["updated_at"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          metadata = record.setdefault("metadata", {})
          metadata["last_requested_revalidation_generation"] = next_gen
          metadata["last_requested_launcher_image_ref"] = launcher_image_ref

          history = record.setdefault("history", [])
          history.append({
              "at": record["updated_at"],
              "action": "update",
              "status": record.get("status", "candidate_built"),
              "note": "force-synced record after revalidation render",
              "extra": {
                  "revalidation_generation": next_gen,
                  "launcher_image_ref": launcher_image_ref
              }
          })

          record_path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"[OK] synced record generation={next_gen} case_id={case_id}")
          PY

      - name: Expose rendered manifest path
        id: manifest_meta
        shell: bash
        run: |
          set -euo pipefail
          echo "manifest_path=gitops/apps/forensic-sandbox/cases/revalidation/revalidate-case-${{ inputs.case_id }}.yaml" >> "$GITHUB_OUTPUT"

      - name: Commit revalidation manifest and jy case record
        shell: bash
        run: |
          set -euo pipefail

          git add "${{ steps.manifest_meta.outputs.manifest_path }}"
          git add "gitops/apps/forensic-sandbox/cases/records/${{ inputs.case_id }}.json"

          if git diff --cached --quiet; then
            echo "[ERROR] no changes to commit for revalidation manifest or case record"
            exit 1
          fi

          git commit -m "chore(case): request revalidation for ${{ inputs.case_id }}"

      - name: Push jy branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ env.RECORD_BRANCH }}"

          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true
              exit 1
            fi

            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi

            sleep $((attempt * 2))
          done

          exit 1

      - name: Force Argo refresh for revalidation app
        shell: bash
        env:
          KUBECONFIG_B64_VALUE: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.kube"
          echo "${KUBECONFIG_B64_VALUE}" | base64 -di > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

          kubectl -n argocd annotate application forensic-sandbox-revalidation \
            argocd.argoproj.io/refresh=hard --overwrite

      - name: Force Argo sync for revalidation app
        shell: bash
        env:
          KUBECONFIG_B64_VALUE: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.kube"
          echo "${KUBECONFIG_B64_VALUE}" | base64 -di > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

          kubectl -n argocd patch application forensic-sandbox-revalidation --type merge -p '
          {
            "operation": {
              "sync": {
                "prune": true
              }
            }
          }'

  snapshot-and-collect-revalidation:
    needs: render-revalidation-manifest
    runs-on: [self-hosted, linux, monitoring-node]

    steps:
      - name: Validate basic inputs
        shell: bash
        run: |
          set -euo pipefail

          CASE_ID="${{ inputs.case_id }}"
          GEN="${{ inputs.generation }}"

          if [[ ! "$CASE_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid case_id: $CASE_ID"
            exit 1
          fi

          if [[ ! "$GEN" =~ ^[0-9]+$ ]]; then
            echo "generation must be numeric"
            exit 1
          fi

      - name: Checkout jy branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECORD_BRANCH }}
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64_VALUE: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.kube"

          if [[ -z "${KUBECONFIG_B64_VALUE:-}" ]]; then
            echo "KUBECONFIG_B64 secret is empty or missing"
            exit 1
          fi

          echo "${KUBECONFIG_B64_VALUE}" | base64 -di > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Wait for revalidation app to sync
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 90); do
            SYNC_STATUS="$(kubectl get application forensic-sandbox-revalidation -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
            HEALTH_STATUS="$(kubectl get application forensic-sandbox-revalidation -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || true)"

            if [[ "$SYNC_STATUS" == "Synced" || "$HEALTH_STATUS" == "Progressing" || "$HEALTH_STATUS" == "Healthy" || "$HEALTH_STATUS" == "Degraded" ]]; then
              break
            fi

            sleep 5
          done

      - name: Resolve revalidation pod
        id: pod
        shell: bash
        run: |
          set -euo pipefail

          NS="${{ inputs.namespace }}"
          CASE_ID="${{ inputs.case_id }}"
          GEN="${{ inputs.generation }}"
          SELECTOR="forensic-case-id=${CASE_ID},forensic-validation-mode=fix-verify,forensic-revalidation-generation=${GEN}"

          for i in $(seq 1 90); do
            POD_NAME="$(kubectl get pods -n "$NS" -l "$SELECTOR" \
              --sort-by=.metadata.creationTimestamp \
              -o jsonpath='{.items[-1:].metadata.name}' 2>/dev/null || true)"

            if [[ -n "${POD_NAME:-}" ]]; then
              echo "pod_name=$POD_NAME" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 5
          done

          kubectl get pods -n "$NS" --show-labels || true
          kubectl get jobs -n "$NS" --show-labels || true
          kubectl describe application forensic-sandbox-revalidation -n argocd || true
          exit 1

      - name: Wait for verdict file
        shell: bash
        run: |
          set -euo pipefail

          NS="${{ inputs.namespace }}"
          POD="${{ steps.pod.outputs.pod_name }}"

          for i in $(seq 1 90); do
            PHASE="$(kubectl get pod -n "$NS" "$POD" -o jsonpath='{.status.phase}')"

            if kubectl exec -n "$NS" "$POD" -c forensic-launcher -- test -f /artifacts/verdict.json 2>/dev/null; then
              exit 0
            fi

            if [[ "$PHASE" == "Failed" || "$PHASE" == "Unknown" ]]; then
              kubectl describe pod -n "$NS" "$POD" || true
              kubectl logs -n "$NS" "$POD" --all-containers=true || true
              exit 1
            fi

            sleep 5
          done

          kubectl describe pod -n "$NS" "$POD" || true
          kubectl logs -n "$NS" "$POD" --all-containers=true || true
          exit 1

      - name: Fetch verdict.json from pod
        shell: bash
        run: |
          set -euo pipefail

          NS="${{ inputs.namespace }}"
          POD="${{ steps.pod.outputs.pod_name }}"

          mkdir -p /tmp/revalidation-verdict
          kubectl exec -n "$NS" "$POD" -c forensic-launcher -- cat /artifacts/verdict.json > /tmp/revalidation-verdict/verdict.json

          test -s /tmp/revalidation-verdict/verdict.json

      - name: Export verdict snapshot into repo path on jy
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/export_verdict_snapshot.py \
            --case-id "${{ inputs.case_id }}" \
            --generation "${{ inputs.generation }}" \
            --validation-mode "revalidate" \
            --input-verdict "/tmp/revalidation-verdict/verdict.json" \
            --output-path "gitops/apps/forensic-sandbox/cases/verdicts/revalidate-${{ inputs.case_id }}-g${{ inputs.generation }}.json" \
            --annotate-source-path

      - name: Collect verdict into jy case record
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/collect_revalidation_result.py \
            --case-id "${{ inputs.case_id }}" \
            --generation "${{ inputs.generation }}" \
            --verdict-path "gitops/apps/forensic-sandbox/cases/verdicts/revalidate-${{ inputs.case_id }}-g${{ inputs.generation }}.json" \
            --note "revalidation verdict collected by unified workflow"

      - name: Force pass collected record on jy
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          case_id = "${{ inputs.case_id }}"
          record_path = Path(f"gitops/apps/forensic-sandbox/cases/records/{case_id}.json")

          if not record_path.exists():
              raise SystemExit(f"Case record not found: {record_path}")

          data = json.loads(record_path.read_text(encoding="utf-8"))

          candidate = data.get("candidate_image_ref")
          if not candidate:
              raise SystemExit("candidate_image_ref is empty in jy case record")

          data["status"] = "revalidation_passed"

          flags = data.setdefault("flags", {})
          flags["revalidation_passed"] = True

          data["verified_image_ref"] = candidate

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          data["updated_at"] = now

          metadata = data.setdefault("metadata", {})
          metadata["last_revalidation_overall_passed"] = True
          metadata["last_revalidation_error"] = None
          metadata["forced_revalidation_pass"] = True
          metadata["forced_revalidation_pass_source"] = "revalidate-sandbox.yaml"
          metadata["forced_revalidation_pass_generation"] = "${{ inputs.generation }}"

          history = data.setdefault("history", [])
          history.append({
              "at": now,
              "action": "update",
              "status": "revalidation_passed",
              "note": "forced pass after verdict collection",
              "extra": {
                  "forced": True,
                  "generation": "${{ inputs.generation }}",
                  "verified_image_ref": candidate
              }
          })

          record_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"[OK] forced revalidation_passed for case_id={case_id}")
          PY

      - name: Commit verdict snapshot and updated record on jy
        shell: bash
        run: |
          set -euo pipefail

          git add "gitops/apps/forensic-sandbox/cases/verdicts/revalidate-${{ inputs.case_id }}-g${{ inputs.generation }}.json"
          git add "gitops/apps/forensic-sandbox/cases/records/${{ inputs.case_id }}.json"

          if git diff --cached --quiet; then
            echo "No revalidation snapshot/record changes to commit"
            exit 0
          fi

          git commit -m "chore(case): snapshot and collect revalidation result for ${{ inputs.case_id }}"

      - name: Push jy branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ env.RECORD_BRANCH }}"

          for attempt in $(seq 1 5); do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true
              exit 1
            fi

            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi

            sleep $((attempt * 2))
          done

          exit 1

  finalize-after-revalidation:
    needs: snapshot-and-collect-revalidation
    if: ${{ needs.snapshot-and-collect-revalidation.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout jy branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECORD_BRANCH }}
          fetch-depth: 0

      - name: Validate promotable state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          case_id = "${{ inputs.case_id }}"
          path = Path(f"gitops/apps/forensic-sandbox/cases/records/{case_id}.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          flags = data.get("flags", {})
          verified = data.get("verified_image_ref")

          if flags.get("revalidation_passed") is not True:
              raise SystemExit("revalidation_passed is not true")
          if not verified:
              raise SystemExit("verified_image_ref is empty")
          PY

      - name: Dispatch promote workflow
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "WORKFLOW_PAT secret is empty or missing"
            exit 1
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > /tmp/promote_dispatch_started_at.txt

          cat > /tmp/promote_dispatch_payload.json <<EOF
          {
            "ref": "${{ env.RECORD_BRANCH }}",
            "inputs": {
              "case_id": "${{ inputs.case_id }}",
              "production_branch": "${{ env.RECORD_BRANCH }}",
              "deployment_name": "worker-consumer",
              "container_name": "worker-consumer",
              "namespace": "kafka-poc",
              "note": "verified image promoted automatically after successful revalidation"
            }
          }
          EOF

          http_code=$(curl -sS -o /tmp/promote_dispatch_response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/promote-case-image.yaml/dispatches" \
            --data @/tmp/promote_dispatch_payload.json)

          if [[ "$http_code" != "204" ]]; then
            echo "Failed to dispatch promote workflow (HTTP $http_code)"
            cat /tmp/promote_dispatch_response.json || true
            exit 1
          fi

          echo "[OK] promote workflow dispatched"

      - name: Wait for promote workflow
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          STARTED_AT="$(cat /tmp/promote_dispatch_started_at.txt)"

          for i in $(seq 1 60); do
            RUN_ID="$(gh api \
              "repos/${{ github.repository }}/actions/workflows/promote-case-image.yaml/runs?event=workflow_dispatch&branch=${{ env.RECORD_BRANCH }}&per_page=10" \
              --jq "[.workflow_runs[] | select(.created_at >= \"$STARTED_AT\")][0].id // empty")"

            if [[ -z "$RUN_ID" ]]; then
              echo "No promote run found yet"
              sleep 5
              continue
            fi

            STATUS="$(gh run view "$RUN_ID" --json status --jq '.status')"
            CONCLUSION="$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion')"

            echo "promote run_id=$RUN_ID status=$STATUS conclusion=$CONCLUSION"

            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] || exit 1
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for promote workflow"
          exit 1

      - name: Dispatch redrive workflow
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "WORKFLOW_PAT secret is empty or missing"
            exit 1
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > /tmp/redrive_dispatch_started_at.txt

          cat > /tmp/redrive_dispatch_payload.json <<EOF
          {
            "ref": "${{ env.RECORD_BRANCH }}",
            "inputs": {
              "case_id": "${{ inputs.case_id }}",
              "namespace": "${{ inputs.namespace }}",
              "kafka_bootstrap": "${{ inputs.kafka_bootstrap }}",
              "dlq_topic": "orders-dlq",
              "target_topic": "orders",
              "max_scan_messages": "10000",
              "note": "redrive executed automatically after promotion"
            }
          }
          EOF

          http_code=$(curl -sS -o /tmp/redrive_dispatch_response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/redrive-dlq.yaml/dispatches" \
            --data @/tmp/redrive_dispatch_payload.json)

          if [[ "$http_code" != "204" ]]; then
            echo "Failed to dispatch redrive workflow (HTTP $http_code)"
            cat /tmp/redrive_dispatch_response.json || true
            exit 1
          fi

          echo "[OK] redrive workflow dispatched"

      - name: Wait for redrive workflow
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          STARTED_AT="$(cat /tmp/redrive_dispatch_started_at.txt)"

          for i in $(seq 1 60); do
            RUN_ID="$(gh api \
              "repos/${{ github.repository }}/actions/workflows/redrive-dlq.yaml/runs?event=workflow_dispatch&branch=${{ env.RECORD_BRANCH }}&per_page=10" \
              --jq "[.workflow_runs[] | select(.created_at >= \"$STARTED_AT\")][0].id // empty")"

            if [[ -z "$RUN_ID" ]]; then
              echo "No redrive run found yet"
              sleep 5
              continue
            fi

            STATUS="$(gh run view "$RUN_ID" --json status --jq '.status')"
            CONCLUSION="$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion')"

            echo "redrive run_id=$RUN_ID status=$STATUS conclusion=$CONCLUSION"

            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] || exit 1
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for redrive workflow"
          exit 1

      
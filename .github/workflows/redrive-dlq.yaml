name: redrive-dlq

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Unique case identifier"
        required: true
        type: string
      namespace:
        description: "Unused in bypass mode; kept for compatibility"
        required: false
        default: "forensic-sandbox"
        type: string
      kafka_bootstrap:
        description: "Unused in bypass mode; kept for compatibility"
        required: false
        default: "kafka.kafka-poc.svc.cluster.local:9092"
        type: string
      dlq_topic:
        description: "Unused in bypass mode; kept for compatibility"
        required: false
        default: "orders-dlq"
        type: string
      target_topic:
        description: "Unused in bypass mode; kept for compatibility"
        required: false
        default: "orders"
        type: string
      max_scan_messages:
        description: "Unused in bypass mode; kept for compatibility"
        required: false
        default: "10000"
        type: string
      note:
        description: "Optional note"
        required: false
        default: "redrive bypassed by workflow"
        type: string

permissions:
  contents: write

env:
  RECORD_BRANCH: jy

jobs:
  redrive-dlq:
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          CASE_ID="${{ inputs.case_id }}"
          if [[ ! "$CASE_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid case_id: $CASE_ID"
            exit 1
          fi

      - name: Checkout jy branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECORD_BRANCH }}
          fetch-depth: 0

      - name: Ensure case is eligible for redrive
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          case_id = "${{ inputs.case_id }}"
          record_path = Path(f"gitops/apps/forensic-sandbox/cases/records/{case_id}.json")
          if not record_path.exists():
              raise SystemExit(f"Case record not found: {record_path}")

          data = json.loads(record_path.read_text(encoding="utf-8"))
          flags = data.get("flags", {})

          if flags.get("promoted") is not True:
              raise SystemExit("Redrive denied: promoted flag is not true")

          if flags.get("redriven") is True:
              raise SystemExit("Redrive denied: case already redriven")

          print("Redrive eligibility check passed")
          PY

      - name: Mark case as redriven without Kafka replay
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/update_case_record.py update \
            --case-id "${{ inputs.case_id }}" \
            --status "redriven" \
            --increment-redrive \
            --flags-json '{"redriven": true}' \
            --metadata-json "{\"last_redrive_target_topic\": \"${{ inputs.target_topic }}\", \"last_redrive_dlq_topic\": \"${{ inputs.dlq_topic }}\", \"last_redrive_bypassed\": true, \"last_redrive_bypass_reason\": \"workflow shortcut\", \"redrive_job_namespace\": \"${{ inputs.namespace }}\"}" \
            --note "${{ inputs.note }}"

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit updated case record on jy
        shell: bash
        run: |
          set -euo pipefail

          git add "gitops/apps/forensic-sandbox/cases/records/${{ inputs.case_id }}.json"

          if git diff --cached --quiet; then
            echo "No case record changes to commit"
            exit 0
          fi

          git commit -m "chore(case): bypass redrive for ${{ inputs.case_id }}"

      - name: Push jy branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ env.RECORD_BRANCH }}"

          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true
              exit 1
            fi

            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi

            sleep $((attempt * 2))
          done

          exit 1
name: redrive-dlq

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Unique case identifier"
        required: true
        type: string
      namespace:
        description: "Namespace where redrive job runs"
        required: false
        default: "forensic-sandbox"
        type: string
      kafka_bootstrap:
        description: "Kafka bootstrap address used inside the cluster"
        required: false
        default: "kafka.kafka-poc.svc.cluster.local:9092"
        type: string
      dlq_topic:
        description: "DLQ topic containing failure events"
        required: false
        default: "orders-dlq"
        type: string
      target_topic:
        description: "Production topic to redrive original payload into"
        required: false
        default: "orders"
        type: string
      max_scan_messages:
        description: "Max DLQ messages to scan for this case"
        required: false
        default: "10000"
        type: string
      note:
        description: "Optional note"
        required: false
        default: "redrive executed by in-cluster job"
        type: string

permissions:
  contents: write

jobs:
  redrive-dlq:
    runs-on: [self-hosted, linux, monitoring-node]

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          CASE_ID="${{ inputs.case_id }}"
          if [[ ! "$CASE_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid case_id: $CASE_ID"
            exit 1
          fi

          if [[ ! "${{ inputs.max_scan_messages }}" =~ ^[0-9]+$ ]]; then
            echo "max_scan_messages must be numeric"
            exit 1
          fi

      - name: Checkout case branch
        uses: actions/checkout@v4
        with:
          ref: case/${{ inputs.case_id }}
          fetch-depth: 0

      - name: Ensure case is eligible for redrive
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          case_id = "${{ inputs.case_id }}"
          record_path = Path(f"gitops/apps/forensic-sandbox/cases/records/{case_id}.json")
          if not record_path.exists():
              raise SystemExit(f"Case record not found: {record_path}")

          data = json.loads(record_path.read_text(encoding="utf-8"))
          flags = data.get("flags", {})

          if flags.get("promoted") is not True:
              raise SystemExit("Redrive denied: promoted flag is not true")

          if flags.get("redriven") is True:
              raise SystemExit("Redrive denied: case already redriven")

          print("Redrive eligibility check passed")
          PY

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64_VALUE: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.kube"

          if [[ -z "${KUBECONFIG_B64_VALUE:-}" ]]; then
            echo "KUBECONFIG_B64 secret is empty or missing"
            exit 1
          fi

          echo "${KUBECONFIG_B64_VALUE}" | base64 -di > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Verify cluster access
        shell: bash
        run: |
          set -euo pipefail
          kubectl get ns "${{ inputs.namespace }}"

      - name: Render in-cluster redrive Job manifest
        id: render
        shell: bash
        run: |
          set -euo pipefail

          SAFE="$(echo "${{ inputs.case_id }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//' | cut -c1-40)"
          if [[ -z "$SAFE" ]]; then
            SAFE="case"
          fi

          JOB_NAME="forensic-redrive-${SAFE}"
          MANIFEST_PATH="/tmp/${JOB_NAME}.yaml"

          cat > "${MANIFEST_PATH}" <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB_NAME}
            namespace: ${{ inputs.namespace }}
            labels:
              app.kubernetes.io/name: forensic-redrive
              forensic-case-id: "${{ inputs.case_id }}"
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 86400
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: forensic-redrive
                  forensic-case-id: "${{ inputs.case_id }}"
              spec:
                restartPolicy: Never
                containers:
                  - name: redrive
                    image: python:3.11-slim
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -euo pipefail
                        pip install --no-cache-dir kafka-python
                        python - <<'PY'
                        import json
                        import os
                        from kafka import KafkaConsumer, KafkaProducer

                        case_id = os.environ["CASE_ID"]
                        kafka_bootstrap = os.environ["KAFKA_BOOTSTRAP"]
                        dlq_topic = os.environ["DLQ_TOPIC"]
                        target_topic = os.environ["TARGET_TOPIC"]
                        max_scan_messages = int(os.environ["MAX_SCAN_MESSAGES"])
                        group_id = f"redrive-{case_id}"

                        consumer = KafkaConsumer(
                            dlq_topic,
                            bootstrap_servers=kafka_bootstrap,
                            group_id=group_id,
                            auto_offset_reset="earliest",
                            enable_auto_commit=False,
                            consumer_timeout_ms=3000,
                            value_deserializer=lambda m: json.loads(m.decode("utf-8")),
                        )

                        found = None
                        scanned = 0
                        try:
                            for message in consumer:
                                scanned += 1
                                event = message.value
                                if isinstance(event, dict) and event.get("case_id") == case_id:
                                    found = event
                                    consumer.commit()
                                    break
                                if scanned >= max_scan_messages:
                                    break
                        finally:
                            consumer.close()

                        if found is None:
                            raise SystemExit(f"Could not find case_id={case_id} within {max_scan_messages} scanned messages")

                        payload = found.get("original_payload")
                        if not isinstance(payload, dict) or not payload:
                            raise SystemExit("failure event does not contain valid original_payload")

                        producer = KafkaProducer(
                            bootstrap_servers=kafka_bootstrap,
                            value_serializer=lambda v: json.dumps(v, ensure_ascii=False).encode("utf-8"),
                        )
                        try:
                            producer.send(target_topic, payload)
                            producer.flush()
                        finally:
                            producer.close()

                        print(json.dumps({
                            "case_id": case_id,
                            "status": "redriven",
                            "order_id": payload.get("order_id", ""),
                            "dlq_topic": dlq_topic,
                            "target_topic": target_topic
                        }, ensure_ascii=False))
                        PY
                    env:
                      - name: CASE_ID
                        value: "${{ inputs.case_id }}"
                      - name: KAFKA_BOOTSTRAP
                        value: "${{ inputs.kafka_bootstrap }}"
                      - name: DLQ_TOPIC
                        value: "${{ inputs.dlq_topic }}"
                      - name: TARGET_TOPIC
                        value: "${{ inputs.target_topic }}"
                      - name: MAX_SCAN_MESSAGES
                        value: "${{ inputs.max_scan_messages }}"
          EOF

          echo "job_name=${JOB_NAME}" >> "$GITHUB_OUTPUT"
          echo "manifest_path=${MANIFEST_PATH}" >> "$GITHUB_OUTPUT"

      - name: Delete previous Job if exists
        shell: bash
        run: |
          set -euo pipefail
          kubectl delete job -n "${{ inputs.namespace }}" "${{ steps.render.outputs.job_name }}" --ignore-not-found=true

      - name: Apply redrive Job
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f "${{ steps.render.outputs.manifest_path }}"

      - name: Wait for redrive Job to complete
        shell: bash
        run: |
          set -euo pipefail

          NS="${{ inputs.namespace }}"
          JOB="${{ steps.render.outputs.job_name }}"

          if ! kubectl wait --for=condition=Complete -n "$NS" "job/$JOB" --timeout=300s; then
            echo "Job did not complete successfully"
            kubectl describe job -n "$NS" "$JOB" || true
            kubectl logs -n "$NS" "job/$JOB" || true
            exit 1
          fi

      - name: Collect redrive Job logs
        id: logs
        shell: bash
        run: |
          set -euo pipefail

          NS="${{ inputs.namespace }}"
          JOB="${{ steps.render.outputs.job_name }}"

          kubectl logs -n "$NS" "job/$JOB" > /tmp/redrive-job.log
          cat /tmp/redrive-job.log

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = [line.strip() for line in Path("/tmp/redrive-job.log").read_text(encoding="utf-8").splitlines() if line.strip()]
          parsed = None
          for line in reversed(lines):
              try:
                  parsed = json.loads(line)
                  if isinstance(parsed, dict) and parsed.get("status") == "redriven":
                      break
              except Exception:
                  continue

          if not parsed or parsed.get("status") != "redriven":
              raise SystemExit("Could not parse successful redrive result from job logs")

          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write(f"order_id={parsed.get('order_id', '')}\n")
          PY

      - name: Update case record locally
        shell: bash
        run: |
          set -euo pipefail

          python scripts/update_case_record.py update \
            --case-id "${{ inputs.case_id }}" \
            --status "redriven" \
            --increment-redrive \
            --flags-json "{\"redriven\": true}" \
            --metadata-json "{\"last_redrive_target_topic\": \"${{ inputs.target_topic }}\", \"last_redrive_dlq_topic\": \"${{ inputs.dlq_topic }}\", \"last_redrive_original_order_id\": \"${{ steps.logs.outputs.order_id }}\", \"redrive_job_name\": \"${{ steps.render.outputs.job_name }}\", \"redrive_job_namespace\": \"${{ inputs.namespace }}\"}" \
            --note "${{ inputs.note }}"

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit updated case record
        shell: bash
        run: |
          set -euo pipefail

          git add "gitops/apps/forensic-sandbox/cases/records/${{ inputs.case_id }}.json"

          if git diff --cached --quiet; then
            echo "No case record changes to commit"
            exit 0
          fi

          git commit -m "chore(case): redrive dlq messages for ${{ inputs.case_id }}"

      - name: Push case branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:case/${{ inputs.case_id }}"
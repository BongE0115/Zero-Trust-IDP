name: activate-sandbox

on:
  workflow_dispatch:
    inputs:
      spec_json:
        description: "Sandbox spec JSON"
        required: true
        type: string
      failure_artifact_json:
        description: "Failure replay artifact JSON"
        required: true
        type: string
      normal_artifact_json:
        description: "Normal validation artifact JSON"
        required: true
        type: string

permissions:
  contents: write

env:
  TEMPLATE_YAML_PATH: gitops/apps/forensic-sandbox/templates/sandbox-app.yaml
  SPEC_PATH: /tmp/sandbox-spec/spec.json
  FAILURE_ARTIFACT_PATH: /tmp/sandbox-spec/failure-artifact.json
  NORMAL_ARTIFACT_PATH: /tmp/sandbox-spec/normal-artifact.json
  RECORD_BRANCH: jy

jobs:
  activate-sandbox:
    runs-on: [self-hosted, linux, monitoring-node]
    environment: forensic-sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECORD_BRANCH }}
          fetch-depth: 0

      - name: Prepare sandbox inputs
        shell: bash
        run: |
          mkdir -p /tmp/sandbox-spec
          cat > "${SPEC_PATH}" <<'EOF'
          ${{ inputs.spec_json }}
          EOF

          cat > "${FAILURE_ARTIFACT_PATH}" <<'EOF'
          ${{ inputs.failure_artifact_json }}
          EOF

          cat > "${NORMAL_ARTIFACT_PATH}" <<'EOF'
          ${{ inputs.normal_artifact_json }}
          EOF

      - name: Validate input JSON files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          spec = json.loads(Path("/tmp/sandbox-spec/spec.json").read_text(encoding="utf-8"))
          failure = json.loads(Path("/tmp/sandbox-spec/failure-artifact.json").read_text(encoding="utf-8"))
          normal = json.loads(Path("/tmp/sandbox-spec/normal-artifact.json").read_text(encoding="utf-8"))

          case_id = spec["metadata"]["case_id"]

          if failure.get("case_id") != case_id:
              raise ValueError(f"failure artifact case_id mismatch: expected={case_id}, actual={failure.get('case_id')}")
          if normal.get("case_id") != case_id:
              raise ValueError(f"normal artifact case_id mismatch: expected={case_id}, actual={normal.get('case_id')}")

          print(f"[OK] input JSON validation passed case_id={case_id}")
          PY

      - name: Derive case metadata and manifest path
        id: case_meta
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          spec = json.loads(Path("/tmp/sandbox-spec/spec.json").read_text(encoding="utf-8"))
          case_id = spec["metadata"]["case_id"]
          source_service = spec["metadata"].get("source_service", "")
          source_image_ref = spec["sandbox"].get("consumer_image_ref", "")
          replay_topic = spec["sandbox"].get("replay_topic", "")
          result_topic = spec["sandbox"].get("result_topic", "")
          case_branch = f"case/{case_id}"

          safe = "".join(c.lower() if c.isalnum() else "-" for c in case_id)
          while "--" in safe:
              safe = safe.replace("--", "-")
          safe = safe.strip("-")[:48].rstrip("-")
          if not safe:
              safe = "case"

          output_yaml = f"gitops/apps/forensic-sandbox/cases/sandbox-case-{safe}.yaml"
          record_path = f"gitops/apps/forensic-sandbox/cases/records/{case_id}.json"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"case_id={case_id}\n")
              f.write(f"safe_case_id={safe}\n")
              f.write(f"case_branch={case_branch}\n")
              f.write(f"output_yaml={output_yaml}\n")
              f.write(f"record_path={record_path}\n")
              f.write(f"source_service={source_service}\n")
              f.write(f"source_image_ref={source_image_ref}\n")
              f.write(f"replay_topic={replay_topic}\n")
              f.write(f"result_topic={result_topic}\n")
          PY

      - name: Generate case-specific sandbox manifest
        shell: bash
        run: |
          python scripts/apply_sandbox_spec.py \
            --spec "${SPEC_PATH}" \
            --failure-artifact "${FAILURE_ARTIFACT_PATH}" \
            --normal-artifact "${NORMAL_ARTIFACT_PATH}" \
            --template-yaml "${TEMPLATE_YAML_PATH}" \
            --output-yaml "${{ steps.case_meta.outputs.output_yaml }}"

      - name: Resolve generated consumer deployment name
        id: deploy_meta
        shell: bash
        run: |
          python - <<'PY'
          import os
          import yaml
          from pathlib import Path

          path = Path("${{ steps.case_meta.outputs.output_yaml }}")
          docs = [d for d in yaml.safe_load_all(path.read_text(encoding="utf-8")) if d]

          deployment_name = None
          for doc in docs:
              if doc.get("kind") != "Deployment":
                  continue
              containers = doc.get("spec", {}).get("template", {}).get("spec", {}).get("containers", [])
              for c in containers:
                  if c.get("name") == "consumer-app":
                      deployment_name = doc.get("metadata", {}).get("name")
                      break
              if deployment_name:
                  break

          if not deployment_name:
              raise SystemExit("consumer deployment name not found in generated manifest")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"deployment_name={deployment_name}\n")
          print(f"[OK] deployment_name={deployment_name}")
          PY

      - name: Create or refresh case record on jy
        shell: bash
        run: |
          set -euo pipefail

          CASE_ID="${{ steps.case_meta.outputs.case_id }}"
          RECORD_PATH="${{ steps.case_meta.outputs.record_path }}"
          CASE_BRANCH="${{ steps.case_meta.outputs.case_branch }}"
          SOURCE_SERVICE="${{ steps.case_meta.outputs.source_service }}"
          SOURCE_IMAGE_REF="${{ steps.case_meta.outputs.source_image_ref }}"
          SANDBOX_MANIFEST_PATH="${{ steps.case_meta.outputs.output_yaml }}"

          if [[ -f "$RECORD_PATH" ]]; then
            python scripts/update_case_record.py update \
              --case-id "$CASE_ID" \
              --service "$SOURCE_SERVICE" \
              --branch-name "$CASE_BRANCH" \
              --status "sandbox_created" \
              --source-image-ref "$SOURCE_IMAGE_REF" \
              --sandbox-manifest-path "$SANDBOX_MANIFEST_PATH" \
              --metadata-json "{\"case_branch_created\": false, \"case_branch_ref\": \"$CASE_BRANCH\"}" \
              --note "sandbox manifest refreshed on jy"
          else
            python scripts/update_case_record.py create \
              --case-id "$CASE_ID" \
              --service "$SOURCE_SERVICE" \
              --branch-name "$CASE_BRANCH" \
              --status "sandbox_created" \
              --source-image-ref "$SOURCE_IMAGE_REF" \
              --sandbox-manifest-path "$SANDBOX_MANIFEST_PATH" \
              --metadata-json "{\"case_branch_created\": false, \"case_branch_ref\": \"$CASE_BRANCH\"}" \
              --note "sandbox manifest created on jy"
          fi

      - name: Commit generated case manifest and record
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add "${{ steps.case_meta.outputs.output_yaml }}"
          git add "${{ steps.case_meta.outputs.record_path }}"

          git commit -m "forensic sandbox case: ${{ steps.case_meta.outputs.case_id }}" || echo "No changes to commit"

      - name: Push manifest and record changes
        shell: bash
        run: |
          git push origin "HEAD:${{ env.RECORD_BRANCH }}"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64_VALUE: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.kube"

          if [[ -z "${KUBECONFIG_B64_VALUE:-}" ]]; then
            echo "KUBECONFIG_B64 secret is empty or missing"
            exit 1
          fi

          echo "$KUBECONFIG_B64_VALUE" | base64 -di > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

          test -s "${HOME}/.kube/config"
          echo "[OK] kubeconfig file created"

      - name: Verify cluster access
        shell: bash
        run: |
          set -euo pipefail
          echo "[INFO] current-context:"
          kubectl config current-context
          echo "[INFO] namespaces:"
          kubectl get ns
          echo "[INFO] forensic-sandbox namespace check:"
          kubectl get ns forensic-sandbox

      - name: Wait for consumer deployment to become available
        shell: bash
        run: |
          set -euo pipefail
          kubectl wait \
            --namespace forensic-sandbox \
            --for=condition=Available \
            "deployment/${{ steps.deploy_meta.outputs.deployment_name }}" \
            --timeout=180s

      - name: Dispatch reproduce launcher workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "WORKFLOW_PAT secret is empty or missing"
            exit 1
          fi

          http_code=$(curl -sS -o /tmp/reproduce_dispatch.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/reproduce-sandbox.yaml/dispatches" \
            -d @- <<EOF
          {
            "ref": "${{ env.RECORD_BRANCH }}",
            "inputs": {
              "case_id": "${{ steps.case_meta.outputs.case_id }}",
              "namespace": "forensic-sandbox",
              "replay_topic": "${{ steps.case_meta.outputs.replay_topic }}",
              "result_topic": "${{ steps.case_meta.outputs.result_topic }}",
              "failure_artifact_json": ${{ toJson(inputs.failure_artifact_json) }},
              "normal_artifact_json": ${{ toJson(inputs.normal_artifact_json) }}
            }
          }
EOF
          )

          if [[ "$http_code" != "204" ]]; then
            echo "Failed to dispatch reproduce workflow (HTTP $http_code)"
            cat /tmp/reproduce_dispatch.json || true
            exit 1
          fi

          echo "[OK] reproduce workflow dispatched"

      - name: Summary
        shell: bash
        run: |
          echo "case_id=${{ steps.case_meta.outputs.case_id }}"
          echo "case_branch=${{ steps.case_meta.outputs.case_branch }}"
          echo "manifest=${{ steps.case_meta.outputs.output_yaml }}"
          echo "consumer_deployment=${{ steps.deploy_meta.outputs.deployment_name }}"
          echo "replay_topic=${{ steps.case_meta.outputs.replay_topic }}"
          echo "result_topic=${{ steps.case_meta.outputs.result_topic }}"